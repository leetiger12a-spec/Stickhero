<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>레전드 히어로 LEGEND HERO</title>
<style>
html,body{margin:0;height:100%;background:#1b1f2e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,14,28,.86);z-index:5;text-align:center;padding:16px;box-sizing:border-box}
.ov.show{display:flex}
#ovTitle{justify-content:space-between;background:linear-gradient(rgba(12,14,28,.5),rgba(12,14,28,0) 24%,rgba(12,14,28,0) 100%);padding:max(18px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
#ovTitle .top{margin-top:2vh}
#ovTitle .bottom{display:flex;flex-direction:column;align-items:center}
#ovTitle .hint{margin-top:6px}
.panel{background:rgba(8,18,30,.62);border:2px solid rgba(255,210,63,.55);border-radius:18px;padding:10px 12px 12px;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.35);width:min(92vw,380px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;backdrop-filter:blur(2px)}
.plabel{font-size:12px;font-weight:800;color:#ffd23f;opacity:.9;letter-spacing:1px}
.pills{display:flex;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:3px;gap:2px}
.pill{font:inherit;font-size:14px;font-weight:800;color:#fff;background:none;border:none;border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.pill.on{background:linear-gradient(#ffe27a,#ffb703);color:#3a1a00;box-shadow:0 2px 0 #b56b00}
#diffDesc{font-size:12px;opacity:.85}
.btn.big{font-size:24px;padding:12px 52px;position:relative;overflow:hidden;margin:4px}
.btn.big::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.mrow{display:flex;gap:8px;margin-top:6px}
.mrow .hb{width:auto;padding:0 12px;font-size:13px;font-weight:800}
#logoImg{width:min(88vw,460px);filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));animation:titleBob 2.4s ease-in-out infinite}
#ovStory{background:#000;z-index:8;padding:0;justify-content:center}
#ovStory img{width:100%;max-width:720px;border-radius:0;animation:storyIn .6s ease-out}
#storyCap{font-size:18px;font-weight:700;line-height:1.5;margin:18px 22px;min-height:54px;max-width:640px}
#storyNext{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));right:18px;font-size:14px;opacity:.75}
#bStorySkip{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px}
#ovMap{justify-content:flex-start;padding:max(12px,env(safe-area-inset-top)) 0 0;background:linear-gradient(#1d3557,#457b9d)}
#mapHead{display:flex;align-items:center;justify-content:space-between;width:min(94vw,440px);margin-bottom:6px}
#mapScroll{flex:1;width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mapInner{position:relative;width:min(94vw,440px);margin:0 auto}
.mnode{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:4px solid #222;font:inherit;font-size:24px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.mnode small{font-size:11px;font-weight:800}
.mnode.lock{filter:grayscale(1) brightness(.6)}
.mnode.cur{animation:pop .7s ease-in-out infinite alternate;border-color:#ffd23f}
.mnode.sel{outline:4px solid #fff}
.mstars{position:absolute;transform:translate(-50%,0);font-size:14px;letter-spacing:-1px;text-shadow:0 1px 2px #000;white-space:nowrap}
.mname{position:absolute;transform:translate(-50%,0);font-size:12px;font-weight:800;white-space:nowrap;text-shadow:0 1px 3px #000}
#mapCard{width:100%;box-sizing:border-box;background:rgba(8,18,30,.92);border-top:3px solid #ffd23f;padding:12px 16px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:4px;min-height:150px}
#mapCard .t{font-size:20px;font-weight:900;color:#ffd23f}
#mapCard .g{font-size:14px}
#mapCard .r{font-size:13px;opacity:.85}
.unlock{margin-top:10px;padding:10px 14px;border:3px solid #ffd23f;border-radius:14px;background:rgba(255,210,63,.15);animation:pop .5s ease-out .8s backwards}
.unlock small{font-size:13px;opacity:.85}
#clrStars{font-size:56px;letter-spacing:6px;margin:4px 0 8px}
#clrStars span{display:inline-block;animation:pop .4s ease-out backwards}
#clrStars .off{filter:grayscale(1) brightness(.5)}
@keyframes storyIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
#ovTitle .best{margin-top:8px;font-size:13px}
#ovTitle .sub{font-size:15px;line-height:1.35}
#ovTitle h1{font-size:clamp(34px,11.5vw,80px);white-space:nowrap;line-height:1;-webkit-text-stroke:2px #3a1a00;animation:titleBob 2.4s ease-in-out infinite}
#ovTitle .kr{font-size:clamp(18px,5.5vw,26px);font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 2px 0 #b5179e,0 0 12px rgba(0,0,0,.6);margin-bottom:6px}
#ovTitle .sub{font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8);margin-bottom:0}
@keyframes titleBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
h1{margin:0 0 4px;font-size:clamp(40px,12vw,72px);letter-spacing:2px;color:#ffd23f;text-shadow:0 4px 0 #b5179e,0 8px 18px rgba(0,0,0,.6)}
h2{margin:0 0 14px;font-size:clamp(30px,9vw,48px);color:#ffd23f;text-shadow:0 3px 0 #b5179e}
.sub{opacity:.9;margin-bottom:18px;font-size:17px}
.btn{font:inherit;font-size:22px;font-weight:800;padding:14px 38px;border-radius:16px;border:none;background:linear-gradient(#ffd23f,#ff9f1c);color:#3a1a00;box-shadow:0 5px 0 #b56b00;cursor:pointer;margin:8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b56b00}
.best{margin-top:14px;font-size:15px;opacity:.85;line-height:1.6}
.hint{margin-top:14px;font-size:13px;opacity:.65;line-height:1.5}
#cards{display:flex;flex-direction:column;gap:12px;width:min(92vw,420px)}
.card{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:#222;background:#fffaf0;border:4px solid #333;border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:0 5px 0 #333;animation:pop .25s ease-out backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #333}
.card .ic{font-size:40px;width:52px;text-align:center;flex:none}
.card .ic img{width:56px;height:56px;object-fit:contain;display:block}
.card .nm{font-size:19px;font-weight:800}
.card .lv{font-size:13px;font-weight:700;color:#fff;background:#e63946;border-radius:8px;padding:1px 7px;margin-left:6px}
.card .lv.new{background:#2a9d8f}
.card .ds{font-size:14px;color:#555;margin-top:3px}
.card .key{margin-left:auto;font-size:13px;color:#999;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.stats{font-size:19px;line-height:1.7;margin-bottom:10px}
.stats b{color:#ffd23f}
.newrec{color:#ff6b6b;font-weight:900;font-size:22px;animation:pop .5s ease-out infinite alternate}
#hudBtns{position:fixed;right:8px;top:140px;z-index:4;display:none;flex-direction:column;gap:8px}
#hudBtns.show{display:flex}
.hb{width:40px;height:40px;border-radius:12px;border:3px solid #333;background:rgba(255,250,240,.85);font-size:18px;cursor:pointer;padding:0;color:#222}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudBtns"><button class="hb" id="bPause" aria-label="일시정지">⏸</button><button class="hb" id="bSound" aria-label="소리">🔊</button></div>

<div class="ov show" id="ovTitle">
 <div class="top">
  <img id="logoImg" alt="LEGEND HERO" style="display:none">
  <h1 id="logoText">LEGEND HERO</h1>
  <div class="kr" id="logoKr">레 전 드 히 어 로</div>
  <div class="sub">나무를 베어 마을을 세우고<br>빨간 막대 군단을 막아라!</div>
 </div>
 <div class="bottom">
  <div class="panel">
   <div class="plabel">난이도</div>
   <div class="pills" id="diffPills"></div>
   <div id="diffDesc"></div>
   <button class="btn big" id="bContinue" style="display:none">▶ 이어하기</button>
   <div class="best" id="saveInfo" style="margin-top:0"></div>
   <button class="btn big" id="bStart">⚔ 출전!</button>
  </div>
  <div class="best" id="bestTitle"></div>
  <div class="mrow"><button class="hb" id="bHelp">❓ 조작법</button><button class="hb" id="bStory" style="display:none">📖 이야기</button><button class="hb" id="bMusicT">🎵 음악</button></div>
  <div class="hint" id="helpBox" style="display:none">📱 화면을 끌어서 이동 · 공격은 자동<br>🌳 나무 옆에 서면 통나무를 모아요 → 🪵 동그라미 위에 서면 건설!<br>⚔ 출격 문으로 모험 → 보스를 잡고 금화를 가져와요<br>💻 WASD / 방향키 이동 · P 일시정지</div>
 </div>
</div>

<div class="ov" id="ovStory">
  <button class="hb" id="bStorySkip" style="width:auto;padding:0 12px;font-size:13px;font-weight:800">건너뛰기 ⏭</button>
  <img id="storyImg" alt="">
  <div id="storyCap"></div>
  <div id="storyNext">화면을 누르면 다음 ▶</div>
</div>

<div class="ov" id="ovMap">
  <div id="mapHead"><h2 style="margin:0">🗺 모험 지도</h2><button class="hb" id="bMapClose" style="width:auto;padding:0 12px;font-weight:800">✖ 닫기</button></div>
  <div id="mapScroll"><div id="mapInner"></div></div>
  <div id="mapCard"></div>
</div>

<div class="ov" id="ovClear">
  <h2 id="clrTitle">스테이지 클리어!</h2>
  <div id="clrStars"></div>
  <div class="stats" id="clrInfo"></div>
  <button class="btn big" id="bClrOk">마을로 ▶</button>
</div>

<div class="ov" id="ovLevel">
  <h2 id="lvlTitle">레벨 업!</h2>
  <div class="sub" id="lvlSub">하나를 골라 강해지자</div>
  <div id="cards"></div>
</div>

<div class="ov" id="ovPause">
  <h2>일시정지</h2>
  <button class="btn" id="bResume">계속하기</button>
  <div class="mrow" style="margin:6px 0 10px"><button class="hb" id="bMusicP" style="width:auto;padding:0 14px;font-weight:800">🎵 음악</button><button class="hb" id="bVibP" style="width:auto;padding:0 14px;font-weight:800">📳 진동</button></div>
  <button class="btn" id="bQuit" style="background:linear-gradient(#ddd,#aaa);box-shadow:0 5px 0 #666">처음으로</button>
</div>

<div class="ov" id="ovOver">
  <h2>게임 오버</h2>
  <div class="stats" id="overStats"></div>
  <div id="overRec"></div>
  <button class="btn" id="bRetry">다시 하기</button>
  <div class="best" id="bestOver"></div>
</div>

<script>
'use strict';
const BUILD = 32;
const BOSS_INTERVAL = 180;      // 보스 등장 간격(초)
const WAVE_INTERVAL = 60;       // 대규모 몰이 이벤트 간격(초)
const MAX_ENEMIES = 220;
const MAP_R = 720;              // 싸움터 반지름
const WALL_R = 165;             // 울타리 반지름
const BASE_R = 34;              // 마을 회관 크기
const WALL_SEGS = 16;
const K = 0.72, IK = 1 / K;      // 3/4 시점: 땅은 세로로 납작하게, 서 있는 물체는 그대로
const TOWER_W = [6, 0, 0, 0, 0], TOWER_G = [0, 20, 40, 70, 110];    // 망루: 처음엔 통나무, 강화는 금화만
const WALL_W = [0, 8, 12, 16, 20], WALL_G = [0, 10, 25, 40, 60];     // 울타리: 현재 Lv 기준
const REPAIR_W = 4;
const GATE = { x: 0, y: 128 };  // 출격 문 자리
const SMITH = { x: -122, y: -8 }; // 대장간 자리
const FORGE_MAX = 10;
const TAVERN = { x: 122, y: -8 };  // 영웅 숙소(동료 고용) 자리
const ALLY_MAX = 4, ALLY_COST = [60, 120, 200, 300];
const ALLY_TYPES = {
  sword:  { name: '고양이 검사', color: '#3fa9f5', hp: 120, icon: '🗡️', desc: '가까이 달려가 칼로 베어요 · 튼튼함' },
  archer: { name: '고양이 궁수', color: '#2ecc71', hp: 80,  icon: '🏹', desc: '멀리서 화살을 쏴요 · 안전하게' },
  bomber: { name: '고양이 폭탄병', color: '#ffd23f', hp: 90, icon: '💣', desc: '느리지만 폭탄 펑! 여러 마리를 한꺼번에' },
  shield: { name: '강아지 방패병', color: '#c68642', hp: 260, icon: '🛡️', desc: '아주 튼튼! 영웅 앞을 막고 방패로 밀쳐내요' },
};
const STAGE_HW = 200;           // 스테이지 길 반폭
const THEMES = [
  { name: '숲',   ground: '#8fd16a', check: 'rgba(255,255,255,.07)', edge: '#2d6a2e', deco: 'tree',   bgm: 'b', map: '#5fae46' },
  { name: '폐허', ground: '#cfc6b0', check: 'rgba(0,0,0,.05)',       edge: '#5c5f66', deco: 'pillar', bgm: 'c', map: '#a89f88' },
  { name: '던전', ground: '#5d4d70', check: 'rgba(0,0,0,.12)',       edge: '#231a2e', deco: 'torch',  bgm: 'd', map: '#5d4d70' },
  { name: '화산', ground: '#7a4a3a', check: 'rgba(255,90,0,.08)',    edge: '#2a1410', deco: 'torch',  bgm: 'c', map: '#b5482e' },
  { name: '성',   ground: '#8d8fa3', check: 'rgba(0,0,0,.08)',       edge: '#2b2d42', deco: 'pillar', bgm: 'boss', map: '#4a4e69' },
];
// 모험 지도 10칸. goal: boss(보스 잡기) / rescue(갇힌 고양이 구출 후 보스) / survive(정해진 시간 버티기) / final(마지막 성)
const STAGES = [
  { name: '숲 입구',         th: 0, goal: 'boss' },
  { name: '고양이 숲',       th: 0, goal: 'rescue' },
  { name: '폐허 광장',       th: 1, goal: 'survive', time: 40 },
  { name: '무너진 신전',     th: 1, goal: 'boss' },
  { name: '어둠의 계단',     th: 2, goal: 'rescue' },
  { name: '던전 투기장',     th: 2, goal: 'survive', time: 55 },
  { name: '던전 깊은 곳',    th: 2, goal: 'boss' },
  { name: '불타는 길',       th: 3, goal: 'rescue' },
  { name: '화산 분화구',     th: 3, goal: 'survive', time: 70 },
  { name: '왕관 괴물의 성',  th: 4, goal: 'final' },
];
const GOAL_TXT = { boss: '👑 끝까지 가서 보스를 물리쳐라', rescue: '🐱 갇힌 고양이 3마리를 구하고 보스를 물리쳐라', survive: '⏱ 몰려오는 적을 버텨라', final: '🏰 왕관 괴물 대왕을 쓰러뜨려라!' };
const GOAL_ICON = { boss: '👑', rescue: '🐱', survive: '⏱', final: '🏰' };

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCALE = 1, VW = 0, VH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SCALE = Math.max(0.85, Math.min(1.6, Math.min(W, H) / 420));
  VW = W / SCALE; VH = H / SCALE;
}
window.addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
// ---------- 그림(스프라이트) ----------
// img/이름.webp 가 있으면 그림으로, 없으면 코드 그림으로 그림
const SPR = {};
const SPR_WHITE = {};  // 맞았을 때 번쩍이는 흰 실루엣
const SPR_INFO = {    // ax: 발 위치(그림 폭 대비), h: 화면 키(월드 단위)
  hero: { ax: 0.42 }, grunt: { ax: 0.45, h: 50 }, runner: { ax: 0.5, h: 42 }, tank: { ax: 0.42, h: 62 },
  boss0: { ax: 0.5, h: 140 }, boss1: { ax: 0.5, h: 140 }, boss2: { ax: 0.5, h: 150 },
  tree: { h: 78 }, stump: { h: 20 }, log: { h: 8 }, stake: { h: 26 }, tower: { h: 76 }, hall: { h: 92 },
  smith: { h: 72 }, pillar: { h: 70 }, torch: { h: 58 }, coin: { h: 12 },
  ally_sword: { ax: 0.5, h: 52 }, ally_archer: { ax: 0.5, h: 52 }, ally_bomber: { ax: 0.45, h: 52 }, ally_shield: { ax: 0.5, h: 54 }, hero_slash: { h: 72 }, hero_walk: { h: 72 }, ally_archer_shoot: { h: 60 }, ally_bomber_toss: { h: 60 }, ally_shield_bash: { h: 60 }, ally_sword_slash: { h: 60 }, ally_sword_walk: { h: 60 }, ally_archer_walk: { h: 60 }, ally_bomber_walk: { h: 60 }, ally_shield_walk: { h: 60 }, sf_plane0: { h: 80 }, sf_plane1: { h: 80 }, sf_plane2: { h: 80 }, sf_plane3: { h: 80 }, sf_plane4: { h: 80 }, sf_pilot0: { h: 70 }, sf_pilot1: { h: 70 }, sf_pilot2: { h: 70 }, sf_pilot3: { h: 70 }, sf_pilot4: { h: 70 }, tavern: { h: 72 }, skyfang_plane: { h: 80 },
};
const SPR_SRC = {};
// 화면에 그릴 크기로 미리 줄여 둔 그림(매 프레임 큰 그림을 줄이면 느림). 화면 크기가 바뀌면 다시 만듦
function bakeSprite(n) {
  const im = SPR_SRC[n]; if (!im) return;
  const hh = SPR_INFO[n].h || 64, px = Math.max(16, Math.round(hh * SCALE * DPR * 1.15));
  const c = document.createElement('canvas'); c.height = px; c.width = Math.round(px * im.width / im.height);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, c.width, c.height);
  const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
  const wx = wc.getContext('2d'); wx.drawImage(c, 0, 0); wx.globalCompositeOperation = 'source-atop'; wx.fillStyle = '#fff'; wx.fillRect(0, 0, wc.width, wc.height);
  SPR[n] = c; SPR_WHITE[n] = wc;
}
// img/ 폴더에 실제로 있는 그림만 불러옴 (없는 파일을 부르면 오류가 남)

    p: { x: 0, y: 0, r: 11, logs: 0, cap: 12, chopT: 0, chop: 0, fullMsg: 0, hp: 100, maxHp: 100, speed: 150, face: 1, ax: 1, ay: 0, inv: 0, walk: 0, moving: false, magnet: 70, dmgMul: 1, cdMul: 1 },

    enemies: [], bullets: [], ebullets: [], booms: [], bombs: [], zaps: [], rings: [], gems: [], hearts: [], parts: [], texts: [], coins: [], corpses: [],
    trees: [], flyers: [], hint: null, mode: 'base', bt: 0, diff: diffSel, stageN: 0, stars: [], st: null, stash: null, gateT: 0,
    smith: false, forge: 0, tavern: false, allies: [], raid: null, raidIn: 0, raidCount: 0, drumT: 0,
    gold: 0, base: { hp: 1500, maxHp: 1500, hitT: 0 }, respawnT: 0, squadAng: Math.random() * 7, squadT: 6,
    walls: Array.from({ length: WALL_SEGS }, () => ({ hp: 0, maxHp: 0, shake: 0 })), wallLvl: 0,
    towers: [], pads: [], baseDead: false,
    spawnAcc: 0, nextBoss: BOSS_INTERVAL, nextWave: WAVE_INTERVAL, bossCount: 0, boss: null,
    shake: 0, swordAng: 0, slow: 0, banner: null, deadT: 0, cam: { x: 0, y: 0 }, lvlFlash: 0,
  };
  G.p.y = 70; G.cam.y = 58;
  // 망루 자리 4곳 + 울타리 강화 자리 1곳 (order 순서대로 하나씩 열림)
  [1, 3, -3, -1].forEach((k, i) => {
    const a = k * Math.PI / 4, x = Math.cos(a) * 108, y = Math.sin(a) * 108;
    G.towers.push({ x, y, lvl: 0, cd: 0 });
    G.pads.push({ kind: 'tower', idx: i, x, y, pw: 0, pg: 0, acc: 0, order: i === 0 ? 0 : i + 1, built: false });
  });
  G.pads.push({ kind: 'wall', x: 0, y: -WALL_R + 52, pw: 0, pg: 0, acc: 0, order: 1, built: false });
  G.pads.push({ kind: 'smith', x: SMITH.x, y: SMITH.y, pw: 0, pg: 0, acc: 0, order: 2, built: false });
  G.pads.push({ kind: 'tavern', x: TAVERN.x, y: TAVERN.y, pw: 0, pg: 0, acc: 0, order: 3, built: false });
  // 나무 숲 4곳 (첫 숲은 마을 가까이)
  const a0 = Math.random() * 7;
  for (let g = 0; g < 4; g++) {
    const ga = a0 + g * Math.PI / 2 + rand(-0.3, 0.3), gr = g === 0 ? 235 : rand(300, 470);
    const cx = Math.cos(ga) * gr, cy = Math.sin(ga) * gr;
    for (let n = 0, tries = 0; n < (g === 0 ? 6 : 9) && tries < 200; tries++) {
      const x = cx + rand(-110, 110), y = cy + rand(-90, 90), r = Math.hypot(x, y);
      if (r < WALL_R + 60 || r > MAP_R - 50 || G.trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < 52 * 52)) continue;
      G.trees.push({ x, y, logs: 4, max: 4, shake: 0, regrow: 0, sz: rand(0.9, 1.15) }); n++;
    }
  }
  upgradeWall(); // 기본 울타리 Lv 1로 시작
  recalcStats();
}

function inputDir() {
  let x = 0, y = 0;
  if (keys['a'] || keys['arrowleft']) x--;
  if (keys['d'] || keys['arrowright']) x++;
  if (keys['w'] || keys['arrowup']) y--;
  if (keys['s'] || keys['arrowdown']) y++;
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), R = 50;
    if (l > 6) {
      if (l > R) { joy.ox = joy.x - dx / l * R; joy.oy = joy.y - dy / l * R; } // 받침이 손가락을 따라옴
      const m = Math.min(1, l / R); return { x: dx / l * m, y: dy / l * m };
    }
  }
  return { x: 0, y: 0 };
}

// 마을에 있을 때 10초마다·건설·귀환·앱 전환 때 자동 저장. 스테이지 안에서는 출격 직전 상태가 남음
const SAVE_KEY = 'stickhero_save', META_KEY = 'stickhero_meta';
function readJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
function saveGame() {
  if (!G || G.mode !== 'base' || G.baseDead || G.deadT > 0 || state === 'over' || state === 'title') return;
  const p = G.p;
  writeJSON(SAVE_KEY, {
    v: 1, build: BUILD, at: Date.now(), diff: G.diff,
    t: G.t, bt: G.bt, kills: G.kills, lvl: G.lvl, xp: G.xp, need: G.need, pending: G.pending,
    weapons: G.weapons, passives: G.passives, gold: G.gold, logs: p.logs, hp: p.dead ? -1 : p.hp,
    base: G.base.hp, wallLvl: G.wallLvl, walls: G.walls.map(w => w.hp), towers: G.towers.map(t => t.lvl),
    pads: G.pads.map(q => [q.built, q.pw, q.pg]), smith: G.smith, forge: G.forge, tavern: G.tavern,
    allies: G.allies.map(a => a.type), stageN: G.stageN, stars: G.stars, bossCount: G.bossCount - (G.boss ? 1 : 0), bossKills: G.bossKills || 0,
    nextBoss: G.boss ? 15 : G.nextBoss, nextWave: G.nextWave, raidCount: G.raidCount - (G.raid ? 1 : 0), raidPending: !!(G.raid || G.raidIn > 0),
  });

}
function loadGame(d) {
  newGame();
  const p = G.p;
  G.diff = d.diff !== undefined ? d.diff : 2;
  G.stars = d.stars || [];
  d.stageN = Math.min(d.stageN || 0, STAGES.length);
  Object.assign(G, { t: d.t, bt: d.bt, kills: d.kills, lvl: d.lvl, xp: d.xp, need: d.need, pending: d.pending || 0, weapons: d.weapons, passives: d.passives,
    gold: d.gold, wallLvl: d.wallLvl, smith: d.smith, forge: d.forge, tavern: d.tavern, stageN: d.stageN, bossCount: d.bossCount,
    bossKills: d.bossKills, nextBoss: d.nextBoss, nextWave: d.nextWave, raidCount: d.raidCount });
  recalcStats();
  p.logs = Math.min(d.logs, p.cap); p.hp = d.hp < 0 ? p.maxHp : Math.min(d.hp, p.maxHp);
  G.base.hp = d.base;
  const mh = 100 + 80 * G.wallLvl;
  G.walls.forEach((w, i) => { w.maxHp = mh; w.hp = d.walls[i]; });
  G.towers.forEach((t, i) => { t.lvl = d.towers[i]; });
  G.pads.forEach((q, i) => { const s = d.pads[i]; if (s) { q.built = s[0]; q.pw = s[1]; q.pg = s[2]; } });
  G.allies = [];

let choices = [];
function openLevelUp() {
  state = 'levelup'; joy = null;
  const pool = [];
  for (const id in WEAP) { const l = G.weapons[id] || 0; if (l < MAX_WLV && (l > 0 || isUnlocked('w', id))) pool.push({ kind: 'w', id, l, w: l === 0 ? 1.3 : 1 }); }
  for (const id in PASS) { const l = G.passives[id] || 0; if (l < PASS[id].max) pool.push({ kind: 'p', id, l, w: 0.8 }); }
  choices = [];
  while (choices.length < 3 && pool.length) {
    let tot = pool.reduce((s, c) => s + c.w, 0), r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].w; if (r <= 0) break; }
    choices.push(pool.splice(i, 1)[0]);
  }
  while (choices.length < 3) choices.push({ kind: 'food', id: 'food', l: 0 });
  const box = $('cards'); box.innerHTML = '';
  choices.forEach((c, i) => {
    const d = c.kind === 'w' ? WEAP[c.id] : c.kind === 'p' ? PASS[c.id] : { name: '치킨', icon: '🍗', desc: '체력을 50 회복' };
    const desc = c.kind === 'w' ? d.desc(c.l) : d.desc;
    const lv = c.kind === 'food' ? '' : c.l === 0 ? '<span class="lv new">NEW</span>' : `<span class="lv">Lv ${c.l}→${c.l + 1}</span>`;
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<div class="ic">${d.icon}</div><div><div class="nm">${d.name}${lv}</div><div class="ds">${desc}</div></div><div class="key">${i + 1}</div>`;
    b.onclick = () => chooseCard(i);
    box.appendChild(b);
  });
  $('lvlTitle').textContent = '레벨 업!';
  $('lvlSub').textContent = `레벨 ${G.lvl - G.pending + 1} 달성! 하나를 골라 강해지자`;
  showOv('ovLevel');
}
function chooseCard(i) {
  if (state !== 'levelup' || !choices[i]) return;
  const c = choices[i];
  if (c.kind === 'w') { G.weapons[c.id] = c.l + 1; if (c.l === 0) G.timers[c.id] = 0.2; }
  else if (c.kind === 'p') { G.passives[c.id] = c.l + 1; recalcStats(); if (c.id === 'hp') G.p.hp = Math.min(G.p.maxHp, G.p.hp + 25); }
  else G.p.hp = Math.min(G.p.maxHp, G.p.hp + 50);
  sfx('pick');
  G.pending--;
  if (G.pending > 0) openLevelUp(); else { state = 'play'; showOv(null); }
}

// 동료 고르기: 레벨업 카드와 같은 화면에 고양이 카드 2장

  state = 'allypick'; joy = null;
  const box = $('cards'); box.innerHTML = '';

// ---------- 마을에서만 일어나는 일 ----------
function updBase(dt) {
  const p = G.p;
  G.bt += dt;
  // SKYFANG 지원 폭격: 적이 많이 몰려오면 가끔 하늘에서 날아와 폭탄을 떨굼
  if (G.planeT === undefined) G.planeT = 70;
  G.planeT -= dt;
  if (G.planeT <= 0 && !G.plane && G.enemies.length >= 8) { G.planeT = rand(70, 100); callPlane(); }
  // 나무 베기: 나무 옆에 서 있으면 자동으로 쾅쾅 → 통나무가 등에 쌓임
  let tree = null, td = 34 * 34;
  for (const t of G.trees) {
    if (t.logs <= 0) { t.regrow -= dt; if (t.regrow <= 0) { t.logs = t.max; burst(t.x, t.y - 20, '#7bed9f', 10, 90, 4, 0.5); } continue; }
    t.shake = Math.max(0, t.shake - dt);
    const d = (t.x - p.x) ** 2 + (t.y - p.y) ** 2;
    if (d < td) { td = d; tree = t; }
  }
  for (const t of G.trees) { // 나무는 통과할 수 없음
    const dx = p.x - t.x, dy = p.y - t.y, d = Math.hypot(dx, dy) || 1;
    if (t.logs > 0 && d < 14) { p.x = t.x + dx / d * 14; p.y = t.y + dy / d * 14; }
  }
  if (tree && !p.dead) {
    if (p.logs >= p.cap) { if (p.fullMsg <= 0) { floatText(p.x, p.y - 50, '가득!', '#ffd23f', 18, 1); p.fullMsg = 2.5; } }
    else {
      p.chopT -= dt;
      if (p.chopT <= 0) {
        p.chopT = 0.32; p.chop = 0.2; p.face = tree.x > p.x ? 1 : -1;
        tree.logs--; tree.shake = 0.25; p.logs++; sfx('stack');
        burst(tree.x - p.face * 4, tree.y - 10, '#c68642', 5, 120, 3, 0.35);
        G.flyers.push({ x0: tree.x, y0: tree.y - 20, x1: p.x, y1: p.y - 30, t: 0, dur: 0.3, kind: 'log' });
        sfx('chop');
        if (tree.logs <= 0) { tree.regrow = 25; sfx('break'); floatText(tree.x, tree.y - 50, '쿵!', '#fff', 18, 0.8); }
      }
    }
  } else p.chopT = Math.min(p.chopT, 0.1);

  // 건설 자리: 위에 서 있으면 통나무·금화가 쏙쏙 들어가 망루·울타리가 지어짐
  for (const pd of G.pads) {
    const c = padCost(pd), oy = padOY(pd);

    if (!pd.on || !c) continue;
    pd.acc += dt;
    while (pd.acc >= 0.07) {
      pd.acc -= 0.07;
      if (pd.pw < c.w && p.logs > 0) {
        p.logs--; pd.pw++; sfx('pay');
        G.flyers.push({ x0: p.x, y0: p.y - 30 - p.logs * 2, x1: pd.x, y1: pd.y + oy, t: 0, dur: 0.25, kind: 'log' });
      } else if (pd.pg < c.g && G.gold > 0) {
        const n = Math.min(Math.max(3, Math.ceil(c.g / 25)), c.g - pd.pg, G.gold);   // 비싼 건 더 빨리 쏙쏙
        G.gold -= n; pd.pg += n; sfx('pay');
        G.flyers.push({ x0: p.x, y0: p.y - 30, x1: pd.x, y1: pd.y + oy, t: 0, dur: 0.25, kind: 'coin' });
      } else { pd.acc = 0; break; }
    }
    if (pd.pw >= c.w && pd.pg >= c.g) { pd.pw = pd.pg = 0; padDone(pd); }
  }
  for (const f of G.flyers) f.t += dt;
  G.flyers = G.flyers.filter(f => f.t < f.dur);

  // 처음 하는 사람을 위한 안내 화살표
  G.hint = null;
  if (!p.dead) {
    const first = G.pads.find(q => q.order === 0);
    const near = (arr) => { let b = null, bd = 1e12; for (const o of arr) { const d = (o.x - p.x) ** 2 + (o.y - p.y) ** 2; if (d < bd) { bd = d; b = o; } } return b; };
    if (!first.built) {
      if (p.logs < TOWER_W[0]) { const t = near(G.trees.filter(t => t.logs > 0)); if (t) G.hint = { x: t.x, y: t.y, text: `🌳 나무 옆에 서면 나무를 베요 (🪵 ${p.logs}/${TOWER_W[0]})` }; }
      else G.hint = { x: first.x, y: first.y, text: '🪵 통나무를 동그라미에 가져가 망루를 지어요!' };
    } else if (p.logs >= p.cap) {

    const n = t.lvl >= 5 ? 3 : t.lvl >= 3 ? 2 : 1, a = Math.atan2(tgt.y - (t.y - 34), tgt.x - t.x);
    for (let k = 0; k < n; k++) {
      const aa = a + (k - (n - 1) / 2) * 0.1;
      G.bullets.push({ x: t.x, y: t.y - 34, vx: Math.cos(aa) * 520, vy: Math.sin(aa) * 520, r: 4, dmg: 10 + 6 * t.lvl, life: 0.8, pierce: t.lvl >= 4 ? 1 : 0, hits: [], kind: 'arrow', tower: true });
    }
    t.cd = Math.max(0.3, 1.0 - 0.13 * t.lvl); t.shot = 0.15;
    sfx('arrow');
  }
  for (const w of G.walls) w.shake = Math.max(0, w.shake - dt);

  // 출격 문: 첫 망루를 지은 뒤 열림. 위에 1초 서 있으면 출격
  G.gateOpen = G.pads.find(q => q.order === 0).built;
  const onGate = G.gateOpen && !p.dead && (p.x - GATE.x) ** 2 + (p.y - GATE.y) ** 2 < 30 * 30;
  if (onGate && (G.boss || G.raid || G.raidIn > 0)) { if (p.fullMsg <= 0) { floatText(p.x, p.y - 50, G.boss ? '보스부터 물리쳐!' : '대습격을 막아야 해!', '#ff6b6b', 16, 1.2); p.fullMsg = 2; } G.gateT = 0; }
  else if (onGate) { G.gateT += dt; if (G.gateT > 1) { openMap(); return; } }
  else G.gateT = 0;
  if (!G.hint && G.gateOpen && G.stageN === 0 && p.logs < p.cap) G.hint = { x: GATE.x, y: GATE.y, text: '⚔ 출격 문에 서면 모험을 떠나요' };

  // 대습격
  if (G.raidIn > 0) { G.raidIn -= dt; if (G.raidIn <= 0) startRaid(); }
  if (G.raid) updRaid(dt);

  // 생성
  G.nextBoss -= dt;
  if (G.nextBoss <= 0) { G.nextBoss = BOSS_INTERVAL; spawnBoss(); }
  G.nextWave -= dt;
  if (G.nextWave <= 0) { G.nextWave = WAVE_INTERVAL; if (!G.boss) spawnWave(); }
  G.squadT -= dt;
  if (G.squadT <= 0) { G.squadT = rand(5, 9); G.squadAng = Math.random() * Math.PI * 2; }
  let rate = ((G.bt < 10 ? 0.35 : 0.5) + G.bt * 0.016) * DF().rate;
  if (G.boss) rate *= 0.35;
  G.spawnAcc += rate * dt;
  while (G.spawnAcc >= 1) { G.spawnAcc--; spawnEnemy(pickType()); }

}

  startAct(G.allies[G.allies.length - 1], 'cheer');
  sfx('level');
}
function placeAllies() { // 장소가 바뀔 때 영웅 곁으로
  const p = G.p;
  for (const a of G.allies) { const an = a.slot * Math.PI / 2 + Math.PI / 4; a.x = p.x + Math.cos(an) * 34; a.y = p.y + Math.sin(an) * 34; }
}
function updAllies(dt) {
  const p = G.p, fm = 1 + 0.1 * G.forge;
  for (const a of G.allies) {
    a.cd -= dt; a.inv -= dt; a.swing -= dt;
    if (a.act) { a.actT += dt; if (a.actT >= ACTS[a.act]) a.act = null; }
    if (a.queue) { for (const q of a.queue) { q.t -= dt; if (q.t <= 0 && !q.done) { q.done = true; if (!a.dead) q.fn(); } } a.queue = a.queue.filter(q => !q.done); }
    if (a.dead) {
      a.reviveT -= dt;
      if (a.reviveT <= 0 && G.mode === 'base') { a.dead = false; a.hp = a.maxHp; a.x = TAVERN.x; a.y = TAVERN.y + 34; a.inv = 2; burst(a.x, a.y - 12, '#7bed9f', 16, 140, 4, 0.5); }
      continue;
    }
    // 자리: 영웅 주위 네 방향(영웅이 쓰러지면 마을 회관 곁)
    const an = a.slot * Math.PI / 2 + Math.PI / 4, hx = p.dead ? 0 : p.x, hy = p.dead ? 50 : p.y;
    let tx = hx + Math.cos(an) * 36, ty = hy + Math.sin(an) * 30;
    // 가까운 적 찾기 (영웅 곁을 너무 벗어나지 않게)
    let foe = null, fd = 1e12;
    for (const e of G.enemies) { const d = (e.x - a.x) ** 2 + (e.y - a.y) ** 2; if (d < fd && (e.x - hx) ** 2 + (e.y - hy) ** 2 < 230 * 230) { fd = d; foe = e; } }
    fd = Math.sqrt(fd);
    if (a.type === 'shield' && foe && fd < 110) { tx = foe.x - Math.sign(foe.x - a.x || 1) * (foe.r + 10); ty = foe.y; }
    if (a.type === 'sword' && foe && fd < 160) { tx = foe.x - Math.sign(foe.x - a.x || 1) * (foe.r + 8); ty = foe.y; }
    const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
    a.moving = d > 4 && !(a.act && a.act !== 'cheer');
    if (a.moving) { const sp = Math.min(d * 6, 165); a.x += dx / d * sp * dt; a.y += dy / d * sp * dt; a.wob += dt * 10; if (Math.abs(dx) > 2) a.face = dx > 0 ? 1 : -1; }
    if (G.mode === 'stage') a.x = clamp(a.x, -STAGE_HW + 10, STAGE_HW - 10);
    // 공격
    if (foe && a.cd <= 0) {
      const ux = (foe.x - a.x) / (fd || 1), uy = (foe.y - a.y) / (fd || 1);
      const later = (t, fn) => (a.queue = a.queue || []).push({ t, fn });
      if (a.type === 'sword' && fd < foe.r + 24) { // 뒤로 젖혔다가 휙! 베기
        startAct(a, 'slash'); a.cd = 0.55; a.face = ux > 0 ? 1 : -1;
        later(0.12, () => { sfx('swing'); if (!foe.dead && Math.hypot(foe.x - a.x, foe.y - a.y) < foe.r + 40) hurtEnemy(foe, 14 * fm, ux, uy, 180); if (Math.random() < 0.06) sfx('meow'); });
      } else if (a.type === 'archer' && fd < 250) { // 활을 당겼다가 슝!
        startAct(a, 'shoot'); a.cd = 0.8; a.face = ux > 0 ? 1 : -1;
        later(SPR.ally_archer_shoot ? 0.34 : 0.22, () => { const tx = foe.dead ? a.x + ux * 100 : foe.x, ty = foe.dead ? a.y + uy * 100 : foe.y, d2 = Math.hypot(tx - a.x, ty - a.y) || 1;
          G.bullets.push({ x: a.x + a.face * 12, y: a.y - 22, vx: (tx - a.x) / d2 * 520, vy: (ty - a.y) / d2 * 520, r: 4, dmg: 9 * fm, life: 0.8, pierce: 0, hits: [], kind: 'arrow' }); sfx('arrow'); });
      } else if (a.type === 'shield' && fd < foe.r + 26) { // 웅크렸다가 방패로 쾅!
        startAct(a, 'bash'); a.cd = 0.9; a.face = ux > 0 ? 1 : -1;
        later(SPR.ally_shield_bash ? 0.18 : 0.14, () => { if (!foe.dead) hurtEnemy(foe, 10 * fm, ux, uy, 520); sfx('thud'); G.shake = Math.max(G.shake, 2); if (Math.random() < 0.15) sfx('bark'); });
      } else if (a.type === 'bomber' && fd < 230) { // 크게 뒤로 젖혔다가 휙 던지기 (손에서 출발)
        startAct(a, 'toss'); a.cd = 2.2; a.face = ux > 0 ? 1 : -1;
        const fx = foe.x, fy = foe.y;
        later(SPR.ally_bomber_toss ? 0.375 : 0.22, () => { G.bombs.push({ x0: a.x + a.face * (SPR.ally_bomber_toss ? 26 : 10), y0: a.y - (SPR.ally_bomber_toss ? 28 : 34), x1: fx, y1: fy, t: 0, dur: 0.6, dmg: 30 * fm }); sfx('toss'); });
      }
    }
    // 맞기
    if (a.inv <= 0) for (const e of G.enemies) {
      if ((e.x - a.x) ** 2 + (e.y - a.y) ** 2 < (e.r + 10) ** 2) {
        a.hp -= e.dmg * (a.type === 'shield' ? 0.5 : 1); a.inv = 0.8; burst(a.x, a.y - 12, '#e63946', 6, 100, 3, 0.3);
        if (a.hp <= 0) { a.dead = true; a.reviveT = 12; burst(a.x, a.y - 12, ALLY_TYPES[a.type].color, 20, 180, 4, 0.6); floatText(a.x, a.y - 40, '으앙!', '#fff', 16, 1); }
        break;
      }
    }
  }
}

function updBombs(dt) {
  for (const b of G.bombs) {
    b.t += dt;
    if (b.t >= b.dur && !b.done) {
      b.done = true;
      const R = 62;
      for (const e of G.enemies) {

}

function updPlane(dt) {

  if (d < 230 && P.drop <= 0) {
    P.drop = Q.gap;
    G.bombs.push({ x0: P.x, y0: P.y, x1: P.x + rand(-Q.spread, Q.spread), y1: P.y + rand(-Q.spread, Q.spread), t: 0, dur: 0.45, dmg: Q.dmg * (1 + 0.1 * G.forge), drop: true, big: Q.dmg >= 80 });
  }

}
function drawPlane() {
  const P = G.plane; if (!P) return;

function updRaid(dt) {

    while (r.acc >= 1) {
      r.acc--;

      const a = r.dirs[Math.floor(Math.random() * r.dirs.length)] + rand(-0.2, 0.2), R = MAP_R - rand(10, 50);

}

function updStage(dt) {

    for (let i = 0; i < n; i++) {

      const e = makeEnemy(type, rand(-STAGE_HW + 25, STAGE_HW - 25), g.y + rand(-70, 70));

  b.hp -= dmg; b.hitT = 0.3; G.shake = Math.max(G.shake, 5);
  burst(rand(-20, 20), rand(-30, 0), '#c0392b', 6, 120, 4, 0.4);
  sfx('baseHit');
  if (b.hp <= 0) {
    b.hp = 0; G.deadT = 2; G.baseDead = true;
    for (let i = 0; i < 4; i++) burst(rand(-30, 30), rand(-40, 10), ['#c0392b', '#8d5524', '#ffd23f', '#555'][i], 40, 300, 7, 1.2);
    banner('마을이 무너졌다…', '', '#ff6b6b', 3);
    sfx('bigBoom');
  }
}

function fireWeapons(dt) {
  const p = G.p;
  for (const id in G.weapons) {
    if (id === 'sword') continue;
    G.timers[id] = (G.timers[id] || 0) - dt;
    if (G.timers[id] > 0) continue;
    const s = wStat(id);
    const tgt = nearest(p.x, p.y, id === 'shotgun' ? 260 : id === 'hammer' ? wStat('hammer').rad + 10 : 420);
    if (!tgt && id !== 'boomerang') { G.timers[id] = 0.1; continue; }
    let ang = tgt ? Math.atan2(tgt.y - (p.y - 12), tgt.x - p.x) : Math.atan2(p.ay, p.ax);
    const ox = p.x, oy = p.y - 12;
    if (id === 'pistol') {
      for (let k = 0; k < s.shots; k++) {
        const a = ang + (k - (s.shots - 1) / 2) * 0.12;
        G.bullets.push({ x: ox, y: oy, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 4, dmg: s.dmg, life: 0.9, pierce: s.pierce, hits: [], kind: 'pistol' });
      }
      sfx('shoot');
    } else if (id === 'shotgun') {
      for (let k = 0; k < s.pellets; k++) {
        const a = ang + (k / (s.pellets - 1) - 0.5) * s.spread + rand(-0.04, 0.04), v = rand(420, 520);
        G.bullets.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4, dmg: s.dmg, life: 0.42, pierce: 0, hits: [], kind: 'shot' });
      }
      burst(ox + Math.cos(ang) * 14, oy + Math.sin(ang) * 14, '#ffb347', 6, 120, 4, 0.2);
      sfx('shotgun');
    } else if (id === 'boomerang') {
      for (let k = 0; k < s.count; k++) {
        const a = ang + (k - (s.count - 1) / 2) * 0.7;
        G.booms.push({ x: ox, y: oy, dx: Math.cos(a), dy: Math.sin(a), spd: 380, dist: 0, range: s.range, back: false, dmg: s.dmg, rot: 0, hits: new Map(), life: 4 });
      }
      sfx('boom');
    } else if (id === 'bolt') { // 첫 적에서 가까운 적으로 지그재그 번개
      let cur = tgt, from = { x: ox, y: oy - 10 }; const hit = new Set();
      for (let k = 0; k <= s.chain && cur; k++) {
        hit.add(cur); zap(from.x, from.y, cur.x, cur.y - 14);
        hurtEnemy(cur, s.dmg, (cur.x - from.x) / 100, (cur.y - from.y) / 100, 60);
        from = { x: cur.x, y: cur.y - 14 };
        let nx = null, nd = s.reach * s.reach;
        for (const e of G.enemies) { if (e.dead || hit.has(e)) continue; const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2; if (d < nd) { nd = d; nx = e; } }
        cur = nx;
      }
      sfx('zap');
    } else if (id === 'hammer') { // 내려찍기: 원 안의 적 모두 + 크게 밀쳐냄
      for (const e of G.enemies) { const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1; if (d < s.rad + e.r) hurtEnemy(e, s.dmg, dx / d, dy / d, 420); }
      G.rings.push({ x: p.x, y: p.y, r: s.rad, life: 0.45, max: 0.45 });
      burst(p.x, p.y, '#ff7b00', 26, s.rad * 3, 6, 0.5); burst(p.x, p.y, '#ffd23f', 14, s.rad * 2, 5, 0.4);
      G.shake = Math.max(G.shake, 7); p.slam = 0.25; sfx('slam'); vib(30);
    }
    G.timers[id] = s.cd * p.cdMul;
  }
}

function zap(x0, y0, x1, y1) {
  const pts = [[x0, y0]], n = 6;
  for (let i = 1; i < n; i++) { const k = i / n; pts.push([x0 + (x1 - x0) * k + rand(-12, 12), y0 + (y1 - y0) * k + rand(-12, 12)]); }
  pts.push([x1, y1]); G.zaps.push({ pts, life: 0.18, max: 0.18 });
  burst(x1, y1, '#9fe8ff', 5, 120, 3, 0.25);
}

// ---------- 업데이트 ----------
function update(dt) {
  const p = G.p;
  if (G.slow > 0) { G.slow -= dt; dt *= 0.35; }
  if (G.intro) { updIntro(dt); G.shake = Math.max(0, G.shake - dt * 30); return; }   // 컷신 동안 게임 멈춤
  if (G.deadT > 0) { G.deadT -= dt; if (G.deadT <= 0) { gameOver(); return; } dt *= 0.4; }
  G.t += dt;

  // 쓰러진 영웅 부활
  if (p.dead) {
    G.respawnT -= dt;
    if (G.respawnT <= 0) {
      if (G.mode === 'stage') returnBase(false);
      p.dead = false; p.hp = p.maxHp; p.inv = 2; p.x = 0; p.y = 60;
      burst(p.x, p.y - 12, '#ffd23f', 30, 220, 5, 0.7); sfx('level');
      banner('영웅 부활!', '', '#ffd23f', 1.2);
    }
  }
  // 플레이어 이동
  if (G.deadT <= 0 && !p.dead) {
    const d = inputDir();
    p.moving = Math.abs(d.x) + Math.abs(d.y) > 0.05;
    if (p.moving) {
      p.x += d.x * p.speed * dt; p.y += d.y * p.speed * dt;
      const l = Math.hypot(d.x, d.y); p.ax = d.x / l; p.ay = d.y / l;
      if (Math.abs(d.x) > 0.1) p.face = d.x > 0 ? 1 : -1;
      p.walk += dt * 12 * Math.min(1, l + 0.3);
      if (G.mode === 'base') {
        const pr = Math.hypot(p.x, p.y), lim = MAP_R - 15;
        if (pr > lim) { p.x *= lim / pr; p.y *= lim / pr; }
      } else {
        p.x = clamp(p.x, -STAGE_HW + 12, STAGE_HW - 12); p.y = clamp(p.y, -G.st.L - 380, 100);
      }
    }
  }
  G.base.hitT -= dt;

  p.chop = Math.max(0, p.chop - dt); p.fullMsg -= dt;
  if (G.mode === 'stage') {
    updStage(dt);
    const st = G.st, cage = st && st.cages.find(c => !c.freed);
    G.hint = !st ? null : st.portal ? { x: st.portal.x, y: st.portal.y, text: '🌀 포털에 서면 마을로 귀환!' }
      : cage && Math.abs(cage.y - p.y) < 500 ? { x: cage.x, y: cage.y, text: '🐱 우리 앞에 서서 고양이를 구해요' } : null;
  }
  else updBase(dt);
  p.inv = Math.max(0, p.inv - dt);


  if (G.deadT <= 0 && !p.dead) fireWeapons(dt);
  // 영웅의 칼: 바로 앞에 적이 오면 젖혔다가 휙 베기 (주변 적 모두)
  if (p.act) { p.actT += dt; if (p.actT >= ACTS[p.act]) p.act = null; }
  p.meleeCd = (p.meleeCd || 0) - dt;
  if (!p.dead && G.deadT <= 0 && p.meleeCd <= 0 && p.chop <= 0) {
    const foe = nearest(p.x, p.y, 58);
    if (foe) {
      p.meleeCd = 0.55 * p.cdMul; p.face = foe.x > p.x ? 1 : -1; startAct(p, 'slash');
      p.slashAt = 0.12;
    }
  }
  if (p.slashAt > 0) { p.slashAt -= dt; if (p.slashAt <= 0) {
    sfx('swing');
    for (const e of G.enemies) { const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1; if (d < 66 + e.r && dx * p.face > -12) hurtEnemy(e, 12, dx / d, dy / d, 240); }
  } }
  updAllies(dt); updBombs(dt); updPlane(dt);
  if (G.radio) { G.radio.t += dt; if (G.radio.t >= G.radio.dur) G.radio = null; else if (Math.floor(G.radio.t * 26) !== Math.floor((G.radio.t - dt) * 26) && G.radio.t * 26 < SKY_SQUAD[G.radio.k].line.length && Math.floor(G.radio.t * 26) % 3 === 0) tone(1300 + Math.random() * 300, 0.025, 'square', 0.015, 0); }
  for (const z of G.zaps) z.life -= dt; G.zaps = G.zaps.filter(z => z.life > 0);
  for (const r of G.rings) r.life -= dt; G.rings = G.rings.filter(r => r.life > 0);
  if (p.slam > 0) p.slam -= dt;
  if (G.mode === 'base') { G.saveT = (G.saveT === undefined ? 10 : G.saveT) - dt; if (G.saveT <= 0) saveGame(); }

  // 회전 칼
  if (G.weapons.sword && !p.dead) {
    const s = wStat('sword');
    G.swordAng += s.spd * dt;
    for (let k = 0; k < s.n; k++) {
      const a = G.swordAng + k / s.n * Math.PI * 2;
      const bx = p.x + Math.cos(a) * s.rad, by = p.y - 12 + Math.sin(a) * s.rad;
      for (const e of G.enemies) {
        if (e.dead || e.swordCd > 0) continue;
        const rr = e.r + 16;
        if ((e.x - bx) ** 2 + (e.y - by) ** 2 < rr * rr) {
          e.swordCd = 0.35;
          hurtEnemy(e, s.dmg, Math.cos(a), Math.sin(a), 260);
          burst(bx, by, '#dff6ff', 3, 120, 3, 0.2);
          sfx('swing');
        }
      }
    }
  }

  // 총알
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of G.enemies) {
      if (e.dead || b.life <= 0) continue;
      const rr = e.r + b.r;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr && !b.hits.includes(e.id)) {
        b.hits.push(e.id);
        const l = Math.hypot(b.vx, b.vy);
        hurtEnemy(e, b.dmg, b.vx / l, b.vy / l, b.kind === 'shot' ? 220 : 140);
        if (b.pierce-- <= 0) b.life = 0;
      }
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);

  // 부메랑
  for (const b of G.booms) {
    b.rot += dt * 18; b.life -= dt;
    if (!b.back) {
      const sp = b.spd * Math.max(0.25, 1 - b.dist / b.range * 0.7);
      b.x += b.dx * sp * dt; b.y += b.dy * sp * dt; b.dist += sp * dt;
      if (b.dist >= b.range) b.back = true;
    } else {
      const dx = p.x - b.x, dy = p.y - 12 - b.y, d = Math.hypot(dx, dy) || 1;
      b.x += dx / d * 420 * dt; b.y += dy / d * 420 * dt;
      if (d < 18) b.life = 0;
    }
    for (const e of G.enemies) {
      if (e.dead) continue;
      const rr = e.r + 13;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr && G.t - (b.hits.get(e.id) || -9) > 0.4) {
        b.hits.set(e.id, G.t);
        hurtEnemy(e, b.dmg, b.back ? -b.dx : b.dx, b.back ? -b.dy : b.dy, 180);
      }
    }
  }
  G.booms = G.booms.filter(b => b.life > 0);

  // 적
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.flash -= dt; e.hitT -= dt; e.swordCd -= dt; e.lunge -= dt; e.wob += dt * (e.hitT > 0 ? 3 : 9);
    const pdx = p.x - e.x, pdy = p.y - 6 - e.y, pd = Math.hypot(pdx, pdy) || 1;
    // 마을: 영웅이 가까우면 영웅을, 아니면 마을을 노림 / 스테이지: 영웅을 발견하면 쫓아옴
    let chase = !p.dead && pd < (e.boss ? 260 : 170);
    if (G.mode === 'stage') { if (pd < 300) e.awake = true; chase = !p.dead && (e.awake || e.boss); }
    const idle = G.mode === 'stage' && !chase;
    const dx = idle ? Math.cos(e.wob * 0.05) : chase ? pdx : -e.x, dy = idle ? Math.sin(e.wob * 0.07) : chase ? pdy : -e.y, d = Math.hypot(dx, dy) || 1;
    if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
    if (e.boss) updBoss(e, dt, dx, dy, d);
    else {
      const sp = (e.hitT > 0 ? 0.35 : 1) * (idle ? 0.15 : 1) * e.spd;
      e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
    }
    e.x += e.kx * dt; e.y += e.ky * dt;
    const decay = Math.exp(-9 * dt); e.kx *= decay; e.ky *= decay;
    if (!p.dead && pd < e.r + p.r + 2) hurtPlayer(e.dmg);
  }
  // 겹침 방지
  const es = G.enemies;
  for (let i = 0; i < es.length; i++) {
    const a = es[i];
    for (let j = i + 1; j < es.length; j++) {
      const b = es[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 < rr * rr && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (rr - d) * 0.5, nx = dx / d, ny = dy / d;
        const wa = a.boss ? 0 : b.boss ? 1 : 0.5, wb = 1 - wa;
        a.x -= nx * push * wa * 2; a.y -= ny * push * wa * 2;
        b.x += nx * push * wb * 2; b.y += ny * push * wb * 2;
      }
    }
  }
  // 울타리에 막히면 울타리를 부수고, 마을 회관에 닿으면 회관을 공격
  for (const e of es) {
    if (e.dead) continue;
    if (G.mode === 'stage') { e.x = clamp(e.x, -STAGE_HW + 8, STAGE_HW - 8); continue; }
    const dB = Math.hypot(e.x, e.y) || 1, w = G.walls[segOf(e.x, e.y)], m = e.r * 0.6;
    let blocked = false;
    if (w.hp > 0) {
      if (!e.inside && dB < WALL_R + m) { const k = (WALL_R + m) / dB; e.x *= k; e.y *= k; blocked = true; }
      else if (e.inside && dB > WALL_R - m) { const k = (WALL_R - m) / dB; e.x *= k; e.y *= k; blocked = true; }
    } else e.inside = dB < WALL_R;
    if (blocked) {
      if (e.boss && e.mode === 'dash') { e.mode = 'walk'; e.st = 1.5; w.hp -= 120; G.shake = 12; }
      attackTarget(e, dt, () => {
        w.hp -= e.dmg * (e.boss ? 2 : 1); w.shake = 0.2; sfx('thud');
        burst(e.x * WALL_R / dB, e.y * WALL_R / dB, '#c68642', 3, 90, 3, 0.3);
        if (w.hp <= 0) {
          w.hp = 0; sfx('break'); G.shake = Math.max(G.shake, 6);
          burst(e.x * WALL_R / dB, e.y * WALL_R / dB, '#8d5524', 18, 200, 5, 0.6);
          floatText(e.x, e.y - 30, '와장창!', '#ffd23f', 20, 1);
        }
      });
    }
    if (dB < BASE_R + e.r) {
      const k = (BASE_R + e.r) / dB; e.x *= k; e.y *= k;
      attackTarget(e, dt, () => hurtBase(e.dmg));
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  for (const c of G.corpses) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.vz -= 600 * dt; c.z = Math.max(0, c.z + c.vz * dt);
    c.rot += c.vr * dt; c.life -= dt; c.vx *= 0.97; c.vy *= 0.97;
  }
  G.corpses = G.corpses.filter(c => c.life > 0);

  // 금화
  for (const c of G.coins) {
    c.age += dt;
    if (c.z > 0 || c.vz > 0) { c.x += c.vx * dt; c.y += c.vy * dt; c.vz -= 500 * dt; c.z = Math.max(0, c.z + c.vz * dt); if (c.z === 0) c.vz = 0; continue; }
    if (p.dead) continue;
    const dx = p.x - c.x, dy = p.y - 10 - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < p.magnet * 1.3 || c.pull || c.age > 5) {
      c.pull = true; const sp = 300 + Math.max(0, 200 - d) * 3;
      c.x += dx / d * sp * dt; c.y += dy / d * sp * dt;
    }
    if (d < 16) { c.dead = true; G.gold++; coinCombo = G.t - coinComboT < 0.6 ? coinCombo + 1 : 0; coinComboT = G.t; sfx('coinCombo'); }
  }
  G.coins = G.coins.filter(c => !c.dead);

  // 보스 탄
  for (const b of G.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (G.mode === 'base' && b.x * b.x + b.y * b.y < (BASE_R + b.r) ** 2) { hurtBase(b.dmg); b.life = 0; continue; }
    if (!p.dead && (b.x - p.x) ** 2 + (b.y - p.y + 12) ** 2 < (b.r + p.r) ** 2) { hurtPlayer(b.dmg); b.life = 0; }
  }
  G.ebullets = G.ebullets.filter(b => b.life > 0);

  // 구슬
  for (const g of G.gems) {
    g.bob += dt * 4; g.age = (g.age || 0) + dt;
    if (p.dead) continue;
    const dx = p.x - g.x, dy = p.y - 10 - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < p.magnet || g.pull || g.age > 6) {
      g.pull = true;
      const sp = 260 + (p.magnet - Math.min(d, p.magnet)) * 4;
      g.x += dx / d * sp * dt; g.y += dy / d * sp * dt;
    }
    if (d < 16) { g.dead = true; G.xp += g.v; sfx('gem'); }
  }
  G.gems = G.gems.filter(g => !g.dead);
  for (const h of G.hearts) {
    h.bob += dt * 4;
    if (!p.dead && (p.x - h.x) ** 2 + (p.y - 10 - h.y) ** 2 < 24 * 24) {
      h.dead = true; p.hp = Math.min(p.maxHp, p.hp + 30);
      floatText(p.x, p.y - 40, '+30', '#2ecc71', 20, 0.9); burst(p.x, p.y - 12, '#ff6b9a', 14, 120, 4, 0.5); sfx('heal');
    }
  }
  G.hearts = G.hearts.filter(h => !h.dead);

  // 레벨업
  while (G.xp >= G.need) {
    G.xp -= G.need; G.lvl++; G.need = xpNeed(G.lvl); G.pending++;
  }

  // 이펙트
  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const t of G.texts) { t.y -= 40 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  G.shake = Math.max(0, G.shake - dt * 30);
  G.lvlFlash = Math.max(0, G.lvlFlash - dt);

  // 카메라
  const fx = (p.dead && G.mode === 'base') || G.baseDead ? 0 : p.x, fy = (p.dead && G.mode === 'base') || G.baseDead ? 0 : p.y - 12;
  G.cam.x += (fx - G.cam.x) * Math.min(1, dt * (p.dead ? 3 : 8));
  G.cam.y += (fy - G.cam.y) * Math.min(1, dt * (p.dead ? 3 : 8));

  if (G.pending > 0 && G.deadT <= 0 && !p.dead) {
    G.lvlFlash = 0.6; burst(p.x, p.y - 12, '#ffd23f', 30, 260, 5, 0.6); sfx('level'); cheerAll();
    openLevelUp();
  }
}

function updBoss(e, dt, dx, dy, d) {
  e.st -= dt;
  if (e.mode === 'walk') {
    e.x += dx / d * e.spd * dt; e.y += dy / d * e.spd * dt;
    if (e.st <= 0) {
      const r = Math.random();
      if (r < 0.4) { e.mode = 'aim'; e.st = 0.9; sfx('warn'); }
      else if (r < 0.75) { e.mode = 'ring'; e.st = 0.3; e.rings = 2 + Math.min(3, e.lvl); }
      else {
        e.mode = 'summon'; e.st = 0.8;
        for (let i = 0; i < 6 + e.lvl * 2; i++) { const a = i / (6 + e.lvl * 2) * Math.PI * 2; G.enemies.push(makeEnemy('runner', e.x + Math.cos(a) * 80, e.y + Math.sin(a) * 80)); }
        burst(e.x, e.y, e.color, 30, 260, 6, 0.6); floatText(e.x, e.y - 80, '나와라 부하들!', '#fff', 18, 1.2);
      }
    }
  } else if (e.mode === 'aim') {
    e.ax = dx / d; e.ay = dy / d;
    if (e.st <= 0) { e.mode = 'dash'; e.st = 0.6; sfx('dash'); G.shake = 10; }
  } else if (e.mode === 'dash') {
    e.x += e.ax * 520 * dt; e.y += e.ay * 520 * dt;

    if (e.st <= 0) { e.mode = 'walk'; e.st = rand(1.8, 2.8); }
  } else if (e.mode === 'ring') {
    if (e.st <= 0) {
      const n = 16, off = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 8, dmg: (12 + e.lvl * 4) * DF().edmg, life: 5 }); }
      G.shake = Math.max(G.shake, 5); sfx('shotgun');
      e.rings--; e.st = 0.45;
      if (e.rings <= 0) { e.mode = 'walk'; e.st = rand(2, 3); }
    }
  } else if (e.mode === 'summon') {
    if (e.st <= 0) { e.mode = 'walk'; e.st = rand(2, 3); }
  }
}

function drawGround() {
  const g = 64, x0 = Math.floor((G.cam.x - VW / 2) / g) - 1, x1 = Math.ceil((G.cam.x + VW / 2) / g) + 1;
  const y0 = Math.floor((G.cam.y - VH * IK / 2) / g) - 1, y1 = Math.ceil((G.cam.y + VH * IK / 2) / g) + 2;
  // 바깥 숲
  ctx.fillStyle = '#3f7d3a'; ctx.fillRect(x0 * g, y0 * g, (x1 - x0) * g, (y1 - y0) * g);
  // 풀밭
  ctx.fillStyle = '#8fd16a'; ctx.beginPath(); ctx.arc(0, 0, MAP_R, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6fb34e'; ctx.lineWidth = 10; ctx.stroke();
  // 체크무늬 잔디
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) if ((x + y) & 1) ctx.fillRect(x * g, y * g, g, g);
  // 마을 마당
  ctx.fillStyle = '#e3c58f'; ctx.beginPath(); ctx.arc(0, 0, WALL_R - 6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(150,110,60,.35)'; ctx.lineWidth = 4; ctx.stroke();
  // 칸마다 고정된 풀·꽃·나무 장식
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const h = Math.abs(Math.sin(x * 127.1 + y * 311.7) * 43758.5) % 1;
    const px = x * g + (h * 300) % g, py = y * g + (h * 700) % g, r = Math.hypot(px, py);
    if (r > MAP_R + 20) { // 숲 나무
      if (h < 0.7) {
        ctx.save(); ctx.translate(px, py); ctx.scale(1, IK);
        ctx.fillStyle = h < 0.35 ? '#2d6a2e' : '#357a36'; ctx.beginPath(); ctx.arc(0, -10, 22 + h * 10, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(-7, -18, 9, 0, 7); ctx.fill();
        ctx.restore();
      }
      continue;
    }
    if (r < WALL_R + 10 || r > MAP_R - 10) continue;
    if (h < 0.22) {
      ctx.strokeStyle = 'rgba(40,110,40,.55)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(px - 4, py); ctx.lineTo(px - 6, py - 7); ctx.moveTo(px, py); ctx.lineTo(px, py - 9); ctx.moveTo(px + 4, py); ctx.lineTo(px + 6, py - 7); ctx.stroke();
    } else if (h < 0.3) {
      ctx.fillStyle = h < 0.26 ? '#fff' : '#ffd23f';
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(px + Math.cos(k * 1.26) * 3, py + Math.sin(k * 1.26) * 3, 2.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(px, py, 1.8, 0, 7); ctx.fill();
    } else if (h < 0.34) {
      ctx.fillStyle = '#9aa0a6'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(px, py, 7, 5, 0, 0, 7); ctx.fill(); ctx.stroke();
    }
  }
}

function drawWallSeg(i) {
  const lvl = G.wallLvl, stone = lvl >= 4;
  {
    const w = G.walls[i], a0 = i / WALL_SEGS * Math.PI * 2, a1 = (i + 1) / WALL_SEGS * Math.PI * 2;
    const n = SPR.stake ? 9 : 5, sh = w.shake > 0 ? rand(-1.5, 1.5) : 0;   // 그림 말뚝은 촘촘하게
    if (w.hp <= 0) { // 부서진 울타리 그루터기
      for (let k = 0; k < n; k++) {
        const a = a0 + (k + 0.5) / n * (a1 - a0), x = Math.cos(a) * WALL_R, y = Math.sin(a) * WALL_R;
        ctx.fillStyle = '#7a4a22'; ctx.fillRect(x - 3, y - 4, 6, 6);

    }

    ctx.beginPath();
    for (let k = 0; k <= 8; k++) { const a = a0 + k / 8 * (a1 - a0), x = Math.cos(a) * WALL_R + sh, y = Math.sin(a) * WALL_R - hgt * 0.5 * IK; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }

      const tilt = dmg > 0.5 && k % 2 ? 0.35 : 0;
      ctx.save(); ctx.translate(x, y); ctx.scale(1, IK); ctx.rotate(tilt);
      if (SPR.stake) { ctx.translate(0, 3); spr('stake', hgt + 10); if (stone) { ctx.globalAlpha = 0.35; spr('stake', hgt + 10, true); } ctx.restore(); continue; }
      ctx.fillStyle = stone ? '#adb5bd' : lvl >= 2 ? '#b5733a' : '#c68642'; ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-4.5, 2); ctx.lineTo(-4.5, -hgt + 5); ctx.lineTo(0, -hgt); ctx.lineTo(4.5, -hgt + 5); ctx.lineTo(4.5, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(1.5, -hgt + 5, 3, hgt - 3);
      ctx.restore();
    }
    if (w.hp < w.maxHp) {

    }
  }
}

  ctx.font = '600 10px system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText('Build ' + BUILD, W - 6, H - 4);
  // 배너
  const bn = G.banner;
  if (bn) {
    const k = bn.t < 0.25 ? bn.t / 0.25 : bn.t > bn.dur - 0.4 ? (bn.dur - bn.t) / 0.4 : 1;
    ctx.globalAlpha = Math.max(0, k);
    const sc = bn.t < 0.25 ? 0.5 + k * 0.5 : 1;
    ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(-W / 2, -38, W, 76);
    hudText(bn.text, 0, -10, Math.min(36, W / 11), bn.color, 'center');
    if (bn.sub) hudText(bn.sub, 0, 22, 16, '#fff', 'center');
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // 보스 등장 붉은 테두리
  if (bn && bn.text.includes('보스 등장')) {
    ctx.strokeStyle = `rgba(255,0,0,${0.35 + 0.3 * Math.sin(G.t * 18)})`; ctx.lineWidth = 18; ctx.strokeRect(0, 0, W, H);
  }
  // SKYFANG 조종사 무전: 얼굴 + 말풍선 (아래에서 쑥 올라왔다 내려감)
  if (G.radio) {
    const R = G.radio, Q = SKY_SQUAD[R.k], pi = SPR['sf_pilot' + R.k];
    const k = R.t < 0.25 ? R.t / 0.25 : R.t > R.dur - 0.3 ? (R.dur - R.t) / 0.3 : 1, off = (1 - ease(Math.max(0, k))) * 140;
    const by = H - 150 + off, size = 78;
    ctx.save(); ctx.globalAlpha = Math.max(0, k);
    // 얼굴 동그라미
    ctx.fillStyle = '#1d3557'; ctx.beginPath(); ctx.arc(14 + size / 2, by + size / 2, size / 2 + 4, 0, 7); ctx.fill();
    ctx.strokeStyle = Q.col; ctx.lineWidth = 4; ctx.stroke();
    if (pi) { ctx.save(); ctx.beginPath(); ctx.arc(14 + size / 2, by + size / 2, size / 2, 0, 7); ctx.clip();
      const ph = size * 1.15, pw = ph * pi.width / pi.height; ctx.drawImage(pi, 14 + size / 2 - pw / 2, by + size - ph + 4 + Math.sin(R.t * 18) * (R.t < 2 ? 1.2 : 0), pw, ph); ctx.restore(); }
    // 이름표
    roundRect(10, by + size - 6, size + 8, 20, 10); ctx.fillStyle = Q.col === '#ffffff' ? '#e9f6ff' : Q.col; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
    hudText(Q.call, 14 + size / 2, by + size + 4, 12, '#fff', 'center');
    // 말풍선 (글자가 한 자씩 나타남)
    const bx = size + 30, bw = Math.min(W - bx - 12, 270), shown = Q.line.slice(0, Math.floor(R.t * 26));
    ctx.font = '800 14px system-ui,sans-serif';
    const words = shown.split(' '), lines = ['']; for (const wd of words) { const tl = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + wd : wd; if (ctx.measureText(tl).width > bw - 20) lines.push(wd); else lines[lines.length - 1] = tl; }
    const bh = 30 + 19 * Math.max(2, lines.length);
    roundRect(bx, by + 6, bw, bh, 14); ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.moveTo(bx + 1, by + 30); ctx.lineTo(bx - 12, by + 38); ctx.lineTo(bx + 1, by + 44); ctx.fill();
    ctx.fillStyle = '#e63946'; ctx.font = '900 11px system-ui,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillText(`📻 ${Q.pilot}`, bx + 10, by + 13);
    ctx.fillStyle = '#222'; ctx.font = '800 14px system-ui,sans-serif';
    lines.forEach((ln, i) => ctx.fillText(ln, bx + 10, by + 31 + i * 19));
    ctx.restore();
  }
  // 피격 붉은 화면
  if (p.inv > 0.45) { ctx.fillStyle = `rgba(255,0,0,${(p.inv - 0.45) * 0.6})`; ctx.fillRect(0, 0, W, H); }
  if (G.intro) drawIntro();
  // 조이스틱
  if (joy) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 7); ctx.fill(); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), m = Math.min(l, 50) / (l || 1);
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(joy.ox + dx * m, joy.oy + dy * m, 22, 0, 7); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ---------- 시작 화면 장면: 보스가 노려보고, 영웅과 고양이 동료, 양옆에서 행진하는 빨간 군단 ----------
function drawTitleScene() {
  const t = performance.now() / 1000, img = n => SPR_SRC[n] || SPR[n];
  // 제목(위)과 패널(아래) 사이 빈 공간에 맞춰 장면 배치
  const topB = Math.min(H * 0.4, ($('ovTitle').querySelector('.top').getBoundingClientRect().bottom || H * 0.25));
  const botT = Math.max(topB + 160, ($('ovTitle').querySelector('.bottom').getBoundingClientRect().top || H * 0.7));
  const A = botT - topB, S = Math.max(0.5, Math.min(1.1, A / 400)) * Math.min(1.2, W / 390);
  const base = botT - 4;                                  // 영웅 발 위치
  const bossBot = base - 62 * S, bossH = Math.min(W * 0.62, (bossBot - topB) * 0.98 + 30 * S);
  const horizon = bossBot - bossH * 0.3;
  // 하늘 노을 → 풀밭
  const hz = Math.max(0.05, Math.min(0.95, horizon / H));
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3b1f4a'); g.addColorStop(hz * 0.7, '#c0392b'); g.addColorStop(hz * 0.98, '#f4a261'); g.addColorStop(hz, '#6fb34e'); g.addColorStop(1, '#8fd16a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let y = 0; y < 14; y++) for (let x = 0; x < 10; x++) if ((x + y) & 1) ctx.fillRect(x * W / 8 - (y % 2) * 10, horizon + y * 60, W / 8, 60);
  const put = (n, x, y, h, flip) => { const im = img(n); if (!im) return; const w = h * im.width / im.height;
    ctx.save(); ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 0, w * 0.35, h * 0.06, 0, 0, 7); ctx.fill();
    ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore(); };
  // 먼 숲
  for (let i = 0; i < 9; i++) put('tree', (i + 0.5) * W / 8.5 + Math.sin(i * 7) * 12, horizon + 6 + (i % 2) * 8, 70 * S);
  // 보스 (뒤에서 숨 쉬듯 출렁, 붉은 기운)
  const bi = Math.floor(t / 4) % 3, br = 1 + Math.sin(t * 2.2) * 0.03;
  ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t * 3); ctx.fillStyle = '#ff3b3b';
  ctx.beginPath(); ctx.ellipse(W / 2, bossBot - bossH * 0.45, bossH * 0.62, bossH * 0.5, 0, 0, 7); ctx.fill(); ctx.restore();
  const bim = img('boss' + bi);
  if (bim) { const w = bossH * bim.width / bim.height; ctx.save(); ctx.translate(W / 2, bossBot); ctx.scale(2 - br, br); ctx.drawImage(bim, -w / 2, -bossH, w, bossH); ctx.restore(); }
  // 양옆에서 행진하는 빨간 군단
  const foes = ['grunt', 'runner', 'grunt', 'tank', 'grunt', 'runner'];
  for (let i = 0; i < 6; i++) {
    const side = i % 2 ? 1 : -1, row = Math.floor(i / 2), hop = Math.abs(Math.sin(t * 6 + i)) * 4 * S;
    const x = W / 2 + side * (W * 0.36 + row * W * 0.04 + Math.sin(t * 1.5 + i) * 6), y = base - 64 * S + row * 30 * S;
    put(foes[i], x, y - hop, (foes[i] === 'tank' ? 64 : foes[i] === 'runner' ? 46 : 54) * S, side > 0);
  }
  // 영웅과 고양이 동료들
  const hop = Math.abs(Math.sin(t * 3)) * 6 * S;
  put('ally_archer', W / 2 - 72 * S, base - 22 * S - Math.abs(Math.sin(t * 3 + 1)) * 4 * S, 62 * S);
  put('ally_bomber', W / 2 + 74 * S, base - 22 * S - Math.abs(Math.sin(t * 3 + 2)) * 4 * S, 62 * S);
  put('ally_sword', W / 2 + 38 * S, base - 6 * S - Math.abs(Math.sin(t * 3 + 3)) * 4 * S, 64 * S);
  put('hero', W / 2 - 14 * S, base - hop, 96 * S);
  // SKYFANG 비행기가 가끔 하늘을 가로지름
  { const pk = (t % 9) / 2.6, pl = img('sf_plane' + (Math.floor(t / 9) % 5)) || img('skyfang_plane');
    if (pk < 1 && pl) { const x = -80 + (W + 160) * pk, y = topB + (horizon - topB) * (0.75 - pk * 0.5), w = Math.min(110, W * 0.26), h = w * pl.height / pl.width;
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(-(horizon - topB) * 0.5, W + 160) + Math.PI / 2); ctx.drawImage(pl, -w / 2, -h / 2, w, h); ctx.restore(); } }
  // 반짝이 가루
  for (let i = 0; i < 14; i++) {
    const k = (t * 0.15 + i / 14) % 1, x = (Math.sin(i * 12.9) * 0.5 + 0.5) * W, y = H * (0.95 - k * 0.7);
    ctx.fillStyle = `rgba(255,230,120,${0.6 * Math.sin(k * Math.PI)})`; ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, 7); ctx.fill();
  }
  ctx.font = '600 10px system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.fillText('Build ' + BUILD, W - 6, H - 4);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!G || state === 'title') { drawTitleScene(); return; }
  const sx = G.shake ? rand(-G.shake, G.shake) : 0, sy = G.shake ? rand(-G.shake, G.shake) : 0;
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * (W / 2 + sx), DPR * (H / 2 + sy));
  ctx.scale(1, K);
  ctx.translate(-G.cam.x, -G.cam.y);
  if (G.mode === 'stage') drawStageGround(); else drawGround();
  drawWorld();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  if (AC) { const k = bgmFor(); if (!bgmCur || bgmCur.key !== k) playBgm(k); }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 테스트·디버그용 훅
window.SH = {
  BUILD,
  get G() { return G; }, get state() { return state; },
  start: startGame, choose: chooseCard,
  addXp(n) { G.xp += n; }, spawnBoss() { spawnBoss(); }, spawnWave() { spawnWave(); },
  give(id, l) { if (WEAP[id]) G.weapons[id] = l; else { G.passives[id] = l; recalcStats(); } },
  kill() { G.p.inv = 0; hurtPlayer(99999); },
  ok() { if (state === 'result') $('bClrOk').click(); else if (state === 'map') closeMap(); },
  plane(k) { if (k !== undefined) lastSquad = (k + 4) % 5; callPlane(); if (k !== undefined) { G.plane.k = k; G.radio.k = k; } }, showClear() {},
  skipIntro() { endIntro(); },
  chooseAlly(i) { chooseAlly(i); },
  killBase() { hurtBase(99999); },
  gold(n) { G.gold += n; },
  enterStage(i) { enterStage(i); }, openMap() { openMap(); }, returnBase(w) { returnBase(w); }, raid() { startRaid(); },
};
</script>
