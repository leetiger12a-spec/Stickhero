<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>StickHero</title>
<style>
html,body{margin:0;height:100%;background:#1b1f2e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(12,14,28,.86);z-index:5;text-align:center;padding:16px;box-sizing:border-box}
.ov.show{display:flex}
h1{margin:0 0 4px;font-size:clamp(40px,12vw,72px);letter-spacing:2px;color:#ffd23f;text-shadow:0 4px 0 #b5179e,0 8px 18px rgba(0,0,0,.6)}
h2{margin:0 0 14px;font-size:clamp(30px,9vw,48px);color:#ffd23f;text-shadow:0 3px 0 #b5179e}
.sub{opacity:.9;margin-bottom:18px;font-size:17px}
.btn{font:inherit;font-size:22px;font-weight:800;padding:14px 38px;border-radius:16px;border:none;background:linear-gradient(#ffd23f,#ff9f1c);color:#3a1a00;box-shadow:0 5px 0 #b56b00;cursor:pointer;margin:8px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b56b00}
.best{margin-top:14px;font-size:15px;opacity:.85;line-height:1.6}
.hint{margin-top:14px;font-size:13px;opacity:.65;line-height:1.5}
#cards{display:flex;flex-direction:column;gap:12px;width:min(92vw,420px)}
.card{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:#222;background:#fffaf0;border:4px solid #333;border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:0 5px 0 #333;animation:pop .25s ease-out backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 #333}
.card .ic{font-size:40px;width:52px;text-align:center;flex:none}
.card .nm{font-size:19px;font-weight:800}
.card .lv{font-size:13px;font-weight:700;color:#fff;background:#e63946;border-radius:8px;padding:1px 7px;margin-left:6px}
.card .lv.new{background:#2a9d8f}
.card .ds{font-size:14px;color:#555;margin-top:3px}
.card .key{margin-left:auto;font-size:13px;color:#999;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.stats{font-size:19px;line-height:1.7;margin-bottom:10px}
.stats b{color:#ffd23f}
.newrec{color:#ff6b6b;font-weight:900;font-size:22px;animation:pop .5s ease-out infinite alternate}
#hudBtns{position:fixed;right:8px;top:140px;z-index:4;display:none;flex-direction:column;gap:8px}
#hudBtns.show{display:flex}
.hb{width:40px;height:40px;border-radius:12px;border:3px solid #333;background:rgba(255,250,240,.85);font-size:18px;cursor:pointer;padding:0;color:#222}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hudBtns"><button class="hb" id="bPause" aria-label="일시정지">⏸</button><button class="hb" id="bSound" aria-label="소리">🔊</button></div>

<div class="ov show" id="ovTitle">
  <h1>STICK HERO</h1>
  <div class="sub">나무를 베어 마을을 세우고, 빨간 막대 군단을 막아라!</div>
  <button class="btn" id="bStart">시작!</button>
  <div class="best" id="bestTitle"></div>
  <div class="hint">📱 화면을 끌어서 이동 · 공격은 자동<br>🌳 나무 옆에 서면 통나무를 모아요 → 🪵 동그라미 위에 서면 건설!<br>⚔ 출격 문으로 모험 → 보스를 잡고 금화를 가져와요<br>💻 WASD / 방향키 이동 · P 일시정지</div>
</div>

<div class="ov" id="ovLevel">
  <h2>레벨 업!</h2>
  <div class="sub" id="lvlSub">하나를 골라 강해지자</div>
  <div id="cards"></div>
</div>

<div class="ov" id="ovPause">
  <h2>일시정지</h2>
  <button class="btn" id="bResume">계속하기</button>
  <button class="btn" id="bQuit" style="background:linear-gradient(#ddd,#aaa);box-shadow:0 5px 0 #666">처음으로</button>
</div>

<div class="ov" id="ovOver">
  <h2>게임 오버</h2>
  <div class="stats" id="overStats"></div>
  <div id="overRec"></div>
  <button class="btn" id="bRetry">다시 하기</button>
  <div class="best" id="bestOver"></div>
</div>

<script>
'use strict';
const BUILD = 10;
const BOSS_INTERVAL = 180;      // 보스 등장 간격(초)
const WAVE_INTERVAL = 60;       // 대규모 몰이 이벤트 간격(초)
const MAX_ENEMIES = 220;
const MAP_R = 720;              // 싸움터 반지름
const WALL_R = 165;             // 울타리 반지름
const BASE_R = 34;              // 마을 회관 크기
const WALL_SEGS = 16;
const K = 0.72, IK = 1 / K;      // 3/4 시점: 땅은 세로로 납작하게, 서 있는 물체는 그대로
const TOWER_W = [6, 0, 0, 0, 0], TOWER_G = [0, 20, 40, 70, 110];    // 망루: 처음엔 통나무, 강화는 금화만
const WALL_W = [0, 8, 12, 16, 20], WALL_G = [0, 10, 25, 40, 60];     // 울타리: 현재 Lv 기준
const REPAIR_W = 4;
const GATE = { x: 0, y: 128 };  // 출격 문 자리
const SMITH = { x: -122, y: -8 }; // 대장간 자리
const FORGE_MAX = 10;
const STAGE_HW = 200;           // 스테이지 길 반폭
const THEMES = [
  { name: '숲',   ground: '#8fd16a', check: 'rgba(255,255,255,.07)', edge: '#2d6a2e', deco: 'tree' },
  { name: '폐허', ground: '#cfc6b0', check: 'rgba(0,0,0,.05)',       edge: '#5c5f66', deco: 'pillar' },
  { name: '던전', ground: '#5d4d70', check: 'rgba(0,0,0,.12)',       edge: '#231a2e', deco: 'torch' },
];

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SCALE = 1, VW = 0, VH = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  SCALE = Math.max(0.85, Math.min(1.6, Math.min(W, H) / 420));
  VW = W / SCALE; VH = H / SCALE;
}
window.addEventListener('resize', resize); resize();

const $ = id => document.getElementById(id);
// ---------- 그림(스프라이트) ----------
// img/이름.webp 가 있으면 그림으로, 없으면 코드 그림으로 그림
const SPR = {};
const SPR_WHITE = {};  // 맞았을 때 번쩍이는 흰 실루엣
const SPR_INFO = {    // ax: 발 위치(그림 폭 대비), h: 화면 키(월드 단위)
  hero: { ax: 0.42 }, grunt: { ax: 0.45, h: 50 }, runner: { ax: 0.5, h: 42 }, tank: { ax: 0.42, h: 62 },
  boss0: { ax: 0.5, h: 140 }, boss1: { ax: 0.5, h: 140 }, boss2: { ax: 0.5, h: 150 },
};
const SPR_SRC = {};
// 화면에 그릴 크기로 미리 줄여 둔 그림(매 프레임 큰 그림을 줄이면 느림). 화면 크기가 바뀌면 다시 만듦
function bakeSprite(n) {
  const im = SPR_SRC[n]; if (!im) return;
  const hh = SPR_INFO[n].h || 64, px = Math.max(16, Math.round(hh * SCALE * DPR * 1.15));
  const c = document.createElement('canvas'); c.height = px; c.width = Math.round(px * im.width / im.height);
  const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, 0, 0, c.width, c.height);
  const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
  const wx = wc.getContext('2d'); wx.drawImage(c, 0, 0); wx.globalCompositeOperation = 'source-atop'; wx.fillStyle = '#fff'; wx.fillRect(0, 0, wc.width, wc.height);
  SPR[n] = c; SPR_WHITE[n] = wc;
}
Object.keys(SPR_INFO).forEach(n => {
  const im = new Image();
  im.onload = () => { SPR_SRC[n] = im; bakeSprite(n); };
  im.src = `img/${n}.webp?b=${BUILD}`;
});
window.addEventListener('resize', () => Object.keys(SPR_SRC).forEach(bakeSprite));
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmtTime = s => { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ---------- 소리 (WebAudio 합성) ----------
let AC = null, master = null, muted = false;
function audioInit() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, delay) {
  if (!AC || muted) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + (delay || 0);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq || 1200;
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfxGap = { hit: 0.045, shoot: 0.07, thud: 0.12, chop: 0.08, coin: 0.04, pay: 0.06, arrow: 0.08, shotgun: 0.1, gem: 0.035, pop: 0.05, swing: 0.25, boom: 0.15, hurt: 0.15 };
const sfxLast = {};
function sfx(n) {
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (sfxGap[n] && sfxLast[n] && now - sfxLast[n] < sfxGap[n]) return;
  sfxLast[n] = now;
  switch (n) {
    case 'shoot': tone(880, 0.06, 'square', 0.04, -400); break;
    case 'shotgun': noise(0.15, 0.18, 1800); tone(180, 0.12, 'square', 0.05, -100); break;
    case 'boom': tone(500, 0.18, 'triangle', 0.05, 300); break;
    case 'swing': noise(0.08, 0.05, 3000); break;
    case 'hit': tone(220 + Math.random() * 80, 0.05, 'square', 0.035, -120); break;
    case 'pop': tone(600 + Math.random() * 300, 0.08, 'sine', 0.07, 500); break;
    case 'gem': tone(1200 + Math.random() * 400, 0.05, 'sine', 0.035, 300); break;
    case 'hurt': tone(160, 0.2, 'sawtooth', 0.09, -90); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.06, 0, i * 0.07)); break;
    case 'pick': tone(784, 0.08, 'square', 0.06, 0); tone(1175, 0.12, 'square', 0.06, 0, 0.07); break;
    case 'warn': tone(330, 0.25, 'sawtooth', 0.07, 0); tone(330, 0.25, 'sawtooth', 0.07, 0, 0.35); break;
    case 'bossIn': for (let i = 0; i < 4; i++) { tone(110, 0.35, 'sawtooth', 0.1, -30, i * 0.45); noise(0.3, 0.12, 300, i * 0.45); } break;
    case 'dash': noise(0.35, 0.15, 600); tone(200, 0.3, 'sawtooth', 0.06, -120); break;
    case 'bigBoom': noise(1.0, 0.35, 500); tone(80, 0.8, 'sawtooth', 0.12, -50); [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.2, 'square', 0.06, 0, 0.5 + i * 0.1)); break;
    case 'heal': tone(660, 0.1, 'sine', 0.08, 300); tone(990, 0.15, 'sine', 0.08, 300, 0.08); break;
    case 'over': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.09, 0, i * 0.2)); break;
    case 'wave': tone(440, 0.15, 'square', 0.06, 0); tone(440, 0.15, 'square', 0.06, 0, 0.2); break;
    case 'thud': noise(0.12, 0.12, 500); tone(120, 0.1, 'triangle', 0.06, -40); break;
    case 'break': noise(0.4, 0.25, 900); tone(200, 0.3, 'sawtooth', 0.06, -150); break;
    case 'coin': tone(1568, 0.05, 'square', 0.03, 0); tone(2093, 0.08, 'square', 0.03, 0, 0.04); break;
    case 'pay': tone(900 + Math.random() * 200, 0.04, 'square', 0.025, 200); break;
    case 'build': [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.06, 0, i * 0.06)); noise(0.2, 0.1, 800); break;
    case 'arrow': noise(0.06, 0.05, 4000); break;
    case 'chop': noise(0.07, 0.15, 1500); tone(180, 0.08, 'square', 0.05, -60); break;
    case 'drum': noise(0.25, 0.3, 220); tone(70, 0.25, 'sine', 0.2, -20); break;
    case 'baseHit': tone(90, 0.25, 'square', 0.08, -30); break;
  }
}

// ---------- 저장 ----------
function loadBest() { try { return JSON.parse(localStorage.getItem('stickhero_best')) || { time: 0, kills: 0, lvl: 0 }; } catch (e) { return { time: 0, kills: 0, lvl: 0 }; } }
function saveBest(b) { try { localStorage.setItem('stickhero_best', JSON.stringify(b)); } catch (e) {} }
function bestText(b) { return b.time > 0 ? `🏆 최고 기록 — 버틴 시간 <b>${fmtTime(b.time)}</b> · 처치 <b>${b.kills}</b> · 레벨 <b>${b.lvl}</b>` : '🏆 아직 기록이 없어요. 첫 기록을 세워 보자!'; }

// ---------- 무기 / 능력 ----------
const WEAP = {
  sword:     { name: '회전 칼',  icon: '🗡️', desc: l => l === 0 ? '내 주위를 빙글빙글 도는 칼!' : '칼날 +1, 공격력·범위 증가' },
  pistol:    { name: '권총',     icon: '🔫', desc: l => l === 0 ? '가장 가까운 적을 자동 조준' : ['', '공격력·연사 증가', '2연발!', '총알이 적을 관통', '3연발!'][l] || '강화' },
  shotgun:   { name: '산탄총',   icon: '💥', desc: l => l === 0 ? '부채꼴로 탄환을 퍼뜨린다' : '탄환 +2, 공격력 증가' },
  boomerang: { name: '부메랑',   icon: '🪃', desc: l => l === 0 ? '날아갔다 돌아오며 모두 관통' : l === 2 || l === 4 ? '부메랑 +1개!' : '공격력·사거리 증가' },
};
const PASS = {
  hp:     { name: '튼튼한 몸', icon: '❤️', max: 5, desc: '최대 체력 +25, 체력 회복' },
  speed:  { name: '날쌘 신발', icon: '👟', max: 5, desc: '이동 속도 +10%' },
  magnet: { name: '자석',     icon: '🧲', max: 5, desc: '구슬 끌어오는 범위 +40%' },
  power:  { name: '힘',       icon: '💪', max: 5, desc: '모든 공격력 +15%' },
  haste:  { name: '번개 손',   icon: '⚡', max: 5, desc: '공격 속도 +10%' },
  bag:    { name: '큰 등짐',   icon: '🎒', max: 3, desc: '통나무를 6개 더 짊어질 수 있어요' },
};
const MAX_WLV = 5;
function wStat(id) {
  const l = G.weapons[id];
  switch (id) {
    case 'sword': return { n: 1 + l, dmg: 8 + 4 * l, rad: 50 + 6 * l, spd: 3.2 + 0.3 * l };
    case 'pistol': return { cd: 0.6 - 0.05 * l, dmg: 10 + 4 * l, shots: l >= 5 ? 3 : l >= 3 ? 2 : 1, pierce: l >= 4 ? 1 : 0 };
    case 'shotgun': return { cd: 1.35 - 0.08 * l, pellets: 3 + 2 * l, dmg: 6 + 2 * l, spread: 0.5 + 0.06 * l };
    case 'boomerang': return { cd: 1.8 - 0.1 * l, count: l >= 5 ? 3 : l >= 3 ? 2 : 1, dmg: 14 + 5 * l, range: 170 + 15 * l };
  }
}
function recalcStats() {
  const p = G.p, ps = G.passives;
  const oldMax = p.maxHp;
  p.maxHp = 100 + 25 * (ps.hp || 0);
  if (p.maxHp > oldMax) p.hp += p.maxHp - oldMax;
  p.speed = 150 * (1 + 0.1 * (ps.speed || 0));
  p.magnet = 70 * (1 + 0.4 * (ps.magnet || 0));
  p.dmgMul = (1 + 0.15 * (ps.power || 0)) * (1 + 0.1 * (G.forge || 0));
  p.cdMul = Math.max(0.5, 1 - 0.1 * (ps.haste || 0));
  p.cap = 12 + 6 * (ps.bag || 0);
}
const xpNeed = l => Math.floor(5 + l * 4 + Math.pow(l, 1.6));

// ---------- 적 ----------
const ETYPES = {
  grunt:  { r: 11, hp: 14, spd: 58,  dmg: 8,  color: '#e63946', xp: 1, gold: 1 },
  runner: { r: 9,  hp: 8,  spd: 100, dmg: 6,  color: '#ff4fa3', xp: 1, gold: 1 },
  tank:   { r: 17, hp: 75, spd: 40,  dmg: 18, color: '#2f6fd6', xp: 5, gold: 4 },
};
const BOSSES = [
  { name: '대왕 슬라임', color: '#e63946' },
  { name: '강철 거인',   color: '#4d6cfa' },
  { name: '불꽃 대마왕', color: '#ff7b00' },
];
const DEATH_WORDS = ['뿅!', '으악!', '꽥!', '펑!', '히잉~', '아야!'];

// ---------- 게임 상태 ----------
let G = null, state = 'title', eid = 0;
function newGame() {
  G = {
    t: 0, kills: 0, lvl: 1, xp: 0, need: xpNeed(1), pending: 0,
    p: { x: 0, y: 0, r: 11, logs: 0, cap: 12, chopT: 0, chop: 0, fullMsg: 0, hp: 100, maxHp: 100, speed: 150, face: 1, ax: 1, ay: 0, inv: 0, walk: 0, moving: false, magnet: 70, dmgMul: 1, cdMul: 1 },
    weapons: { pistol: 1 }, passives: {}, timers: {},
    enemies: [], bullets: [], ebullets: [], booms: [], gems: [], hearts: [], parts: [], texts: [], coins: [], corpses: [],
    trees: [], flyers: [], hint: null, mode: 'base', bt: 0, stageN: 0, st: null, stash: null, gateT: 0,
    smith: false, forge: 0, raid: null, raidIn: 0, raidCount: 0, drumT: 0,
    gold: 0, base: { hp: 1500, maxHp: 1500, hitT: 0 }, respawnT: 0, squadAng: Math.random() * 7, squadT: 6,
    walls: Array.from({ length: WALL_SEGS }, () => ({ hp: 0, maxHp: 0, shake: 0 })), wallLvl: 0,
    towers: [], pads: [], baseDead: false,
    spawnAcc: 0, nextBoss: BOSS_INTERVAL, nextWave: WAVE_INTERVAL, bossCount: 0, boss: null,
    shake: 0, swordAng: 0, slow: 0, banner: null, deadT: 0, cam: { x: 0, y: 0 }, lvlFlash: 0,
  };
  G.p.y = 70; G.cam.y = 58;
  // 망루 자리 4곳 + 울타리 강화 자리 1곳 (order 순서대로 하나씩 열림)
  [1, 3, -3, -1].forEach((k, i) => {
    const a = k * Math.PI / 4, x = Math.cos(a) * 108, y = Math.sin(a) * 108;
    G.towers.push({ x, y, lvl: 0, cd: 0 });
    G.pads.push({ kind: 'tower', idx: i, x, y, pw: 0, pg: 0, acc: 0, order: i === 0 ? 0 : i + 1, built: false });
  });
  G.pads.push({ kind: 'wall', x: 0, y: -WALL_R + 52, pw: 0, pg: 0, acc: 0, order: 1, built: false });
  G.pads.push({ kind: 'smith', x: SMITH.x, y: SMITH.y, pw: 0, pg: 0, acc: 0, order: 2, built: false });
  // 나무 숲 4곳 (첫 숲은 마을 가까이)
  const a0 = Math.random() * 7;
  for (let g = 0; g < 4; g++) {
    const ga = a0 + g * Math.PI / 2 + rand(-0.3, 0.3), gr = g === 0 ? 235 : rand(300, 470);
    const cx = Math.cos(ga) * gr, cy = Math.sin(ga) * gr;
    for (let n = 0, tries = 0; n < (g === 0 ? 6 : 9) && tries < 200; tries++) {
      const x = cx + rand(-110, 110), y = cy + rand(-90, 90), r = Math.hypot(x, y);
      if (r < WALL_R + 60 || r > MAP_R - 50 || G.trees.some(t => (t.x - x) ** 2 + (t.y - y) ** 2 < 52 * 52)) continue;
      G.trees.push({ x, y, logs: 4, max: 4, shake: 0, regrow: 0, sz: rand(0.9, 1.15) }); n++;
    }
  }

  recalcStats();
}

function inputDir() {
  let x = 0, y = 0;

  if (keys['w'] || keys['arrowup']) y--;
  if (keys['s'] || keys['arrowdown']) y++;
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), R = 50;
    if (l > 6) {

      const m = Math.min(1, l / R); return { x: dx / l * m, y: dy / l * m };

}

let choices = [];
function openLevelUp() {
  state = 'levelup'; joy = null;

const segOf = (x, y) => { let a = Math.atan2(y, x); if (a < 0) a += Math.PI * 2; return Math.floor(a / (Math.PI * 2) * WALL_SEGS) % WALL_SEGS; };
function upgradeWall() {
  if (G.wallLvl < 5) G.wallLvl++;
  const mh = 100 + 80 * G.wallLvl;
  for (const w of G.walls) { w.maxHp = mh; w.hp = mh; }
}
function repairWall() { for (const w of G.walls) w.hp = w.maxHp; }
function padVisible(pd) { return pd.order === 0 || G.pads.some(q => q.order === pd.order - 1 && q.built); }
function padCost(pd) {
  if (!padVisible(pd)) return null;
  if (pd.kind === 'tower') { const l = G.towers[pd.idx].lvl; return l < 5 ? { w: TOWER_W[l], g: TOWER_G[l] } : null; }

}
const padOY = pd => pd.kind === 'tower' && G.towers[pd.idx].lvl > 0 ? 40 : pd.kind === 'smith' && G.smith ? 30 : 0;
function padLabel(pd) {
  if (pd.kind === 'tower') { const l = G.towers[pd.idx].lvl; return l === 0 ? '망루 짓기' : l < 5 ? `망루 Lv${l + 1}` : '망루 MAX'; }

}
function padDone(pd) {
  pd.built = true;
  if (pd.kind === 'tower') {
    const t = G.towers[pd.idx]; t.lvl++;
    banner(t.lvl === 1 ? '망루 완성!' : `망루 Lv ${t.lvl}!`, t.lvl === 1 ? '자동으로 화살을 쏴요' : '더 빠르고 강하게!', '#7bed9f', 1.6);

    burst(SMITH.x, SMITH.y - 20, '#ff9f1c', 30, 220, 5, 0.6);

function makeEnemy(type, x, y) {

}
function spawnEnemy(type) {

function pickType() {

function spawnWave() {

function spawnBoss(bx, by) {

// ---------- 마을에서만 일어나는 일 ----------
function updBase(dt) {
  const p = G.p;
  G.bt += dt;
  // 나무 베기: 나무 옆에 서 있으면 자동으로 쾅쾅 → 통나무가 등에 쌓임
  let tree = null, td = 34 * 34;
  for (const t of G.trees) {
    if (t.logs <= 0) { t.regrow -= dt; if (t.regrow <= 0) { t.logs = t.max; burst(t.x, t.y - 20, '#7bed9f', 10, 90, 4, 0.5); } continue; }
    t.shake = Math.max(0, t.shake - dt);
    const d = (t.x - p.x) ** 2 + (t.y - p.y) ** 2;
    if (d < td) { td = d; tree = t; }
  }
  for (const t of G.trees) { // 나무는 통과할 수 없음
    const dx = p.x - t.x, dy = p.y - t.y, d = Math.hypot(dx, dy) || 1;
    if (t.logs > 0 && d < 14) { p.x = t.x + dx / d * 14; p.y = t.y + dy / d * 14; }
  }
  if (tree && !p.dead) {
    if (p.logs >= p.cap) { if (p.fullMsg <= 0) { floatText(p.x, p.y - 50, '가득!', '#ffd23f', 18, 1); p.fullMsg = 2.5; } }
    else {
      p.chopT -= dt;
      if (p.chopT <= 0) {
        p.chopT = 0.32; p.chop = 0.2; p.face = tree.x > p.x ? 1 : -1;
        tree.logs--; tree.shake = 0.25; p.logs++;
        burst(tree.x - p.face * 4, tree.y - 10, '#c68642', 5, 120, 3, 0.35);
        G.flyers.push({ x0: tree.x, y0: tree.y - 20, x1: p.x, y1: p.y - 30, t: 0, dur: 0.3, kind: 'log' });
        sfx('chop');
        if (tree.logs <= 0) { tree.regrow = 25; sfx('break'); floatText(tree.x, tree.y - 50, '쿵!', '#fff', 18, 0.8); }
      }
    }
  } else p.chopT = Math.min(p.chopT, 0.1);

  // 건설 자리: 위에 서 있으면 통나무·금화가 쏙쏙 들어가 망루·울타리가 지어짐
  for (const pd of G.pads) {
    const c = padCost(pd), oy = padOY(pd);
    pd.on = !p.dead && (p.x - pd.x) ** 2 + (p.y - pd.y - oy) ** 2 < 26 * 26;
    if (!pd.on || !c) continue;
    pd.acc += dt;
    while (pd.acc >= 0.07) {
      pd.acc -= 0.07;
      if (pd.pw < c.w && p.logs > 0) {
        p.logs--; pd.pw++; sfx('pay');
        G.flyers.push({ x0: p.x, y0: p.y - 30 - p.logs * 2, x1: pd.x, y1: pd.y + oy, t: 0, dur: 0.25, kind: 'log' });
      } else if (pd.pg < c.g && G.gold > 0) {
        const n = Math.min(3, c.g - pd.pg, G.gold); G.gold -= n; pd.pg += n; sfx('pay');
        G.flyers.push({ x0: p.x, y0: p.y - 30, x1: pd.x, y1: pd.y + oy, t: 0, dur: 0.25, kind: 'coin' });
      } else { pd.acc = 0; break; }
    }
    if (pd.pw >= c.w && pd.pg >= c.g) { pd.pw = pd.pg = 0; padDone(pd); }
  }
  for (const f of G.flyers) f.t += dt;
  G.flyers = G.flyers.filter(f => f.t < f.dur);

  // 처음 하는 사람을 위한 안내 화살표
  G.hint = null;
  if (!p.dead) {
    const first = G.pads.find(q => q.order === 0);
    const near = (arr) => { let b = null, bd = 1e12; for (const o of arr) { const d = (o.x - p.x) ** 2 + (o.y - p.y) ** 2; if (d < bd) { bd = d; b = o; } } return b; };
    if (!first.built) {
      if (p.logs < TOWER_W[0]) { const t = near(G.trees.filter(t => t.logs > 0)); if (t) G.hint = { x: t.x, y: t.y, text: `🌳 나무 옆에 서면 나무를 베요 (🪵 ${p.logs}/${TOWER_W[0]})` }; }
      else G.hint = { x: first.x, y: first.y, text: '🪵 통나무를 동그라미에 가져가 망루를 지어요!' };
    } else if (p.logs >= p.cap) {
      const pd = near(G.pads.filter(q => padCost(q) && padCost(q).w > 0).map(q => ({ x: q.x, y: q.y + padOY(q) })));
      if (pd) G.hint = { x: pd.x, y: pd.y, text: '🎒 가득 찼어요! 동그라미로 가져가요' };
    }
  }

  // 망루
  for (const t of G.towers) {
    if (!t.lvl) continue;
    t.cd -= dt;
    if (t.cd > 0) continue;
    const range = 210 + 20 * t.lvl, tgt = nearest(t.x, t.y - 34, range);
    if (!tgt) { t.cd = 0.15; continue; }
    const n = t.lvl >= 5 ? 3 : t.lvl >= 3 ? 2 : 1, a = Math.atan2(tgt.y - (t.y - 34), tgt.x - t.x);
    for (let k = 0; k < n; k++) {
      const aa = a + (k - (n - 1) / 2) * 0.1;
      G.bullets.push({ x: t.x, y: t.y - 34, vx: Math.cos(aa) * 520, vy: Math.sin(aa) * 520, r: 4, dmg: 10 + 6 * t.lvl, life: 0.8, pierce: t.lvl >= 4 ? 1 : 0, hits: [], kind: 'arrow', tower: true });
    }
    t.cd = Math.max(0.3, 1.0 - 0.13 * t.lvl); t.shot = 0.15;
    sfx('arrow');
  }
  for (const w of G.walls) w.shake = Math.max(0, w.shake - dt);

  // 출격 문: 첫 망루를 지은 뒤 열림. 위에 1초 서 있으면 출격
  G.gateOpen = G.pads.find(q => q.order === 0).built;
  const onGate = G.gateOpen && !p.dead && (p.x - GATE.x) ** 2 + (p.y - GATE.y) ** 2 < 30 * 30;
  if (onGate && (G.boss || G.raid || G.raidIn > 0)) { if (p.fullMsg <= 0) { floatText(p.x, p.y - 50, G.boss ? '보스부터 물리쳐!' : '대습격을 막아야 해!', '#ff6b6b', 16, 1.2); p.fullMsg = 2; } G.gateT = 0; }
  else if (onGate) { G.gateT += dt; if (G.gateT > 1) { enterStage(); return; } }
  else G.gateT = 0;
  if (!G.hint && G.gateOpen && G.stageN === 0 && p.logs < p.cap) G.hint = { x: GATE.x, y: GATE.y, text: '⚔ 출격 문에 서면 모험을 떠나요' };

  // 대습격
  if (G.raidIn > 0) { G.raidIn -= dt; if (G.raidIn <= 0) startRaid(); }
  if (G.raid) updRaid(dt);

  // 생성
  G.nextBoss -= dt;
  if (G.nextBoss <= 0) { G.nextBoss = BOSS_INTERVAL; spawnBoss(); }
  G.nextWave -= dt;
  if (G.nextWave <= 0) { G.nextWave = WAVE_INTERVAL; if (!G.boss) spawnWave(); }
  G.squadT -= dt;
  if (G.squadT <= 0) { G.squadT = rand(5, 9); G.squadAng = Math.random() * Math.PI * 2; }
  let rate = (G.bt < 10 ? 0.35 : 0.5) + G.bt * 0.016;
  if (G.boss) rate *= 0.35;
  G.spawnAcc += rate * dt;
  while (G.spawnAcc >= 1) { G.spawnAcc--; spawnEnemy(pickType()); }

}

// ---------- 대습격 ----------
function startRaid() {
  const a0 = Math.random() * 7, nd = G.raidCount >= 1 ? 4 : 3;
  G.raid = { t: 0, dur: 30, n: G.raidCount++, dirs: Array.from({ length: nd }, (_, i) => a0 + i / nd * Math.PI * 2), acc: 0, bossDone: false };
  banner('⚠ 대습격! ⚠', '사방에서 쳐들어온다! 마을을 지켜라!', '#ff3b3b', 3);
  G.shake = 14; sfx('bossIn');
}
function updRaid(dt) {
  const r = G.raid;
  r.t += dt;
  if (r.t < r.dur) {
    G.drumT -= dt;
    if (G.drumT <= 0) { G.drumT = 0.6; sfx('drum'); }
    r.acc += (2.5 + r.n * 1.0) * dt;
    while (r.acc >= 1) {
      r.acc--;
      if (G.enemies.length >= MAX_ENEMIES + 60) break;
      const a = r.dirs[Math.floor(Math.random() * r.dirs.length)] + rand(-0.2, 0.2), R = MAP_R - rand(10, 50);
      const q = Math.random(), type = q < 0.12 + r.n * 0.04 ? 'tank' : q < 0.45 ? 'runner' : 'grunt';
      const e = makeEnemy(type, Math.cos(a) * R, Math.sin(a) * R); e.raid = true;
      G.enemies.push(e);
    }
  }
  if (r.t > 6 && !r.bossDone) { r.bossDone = true; if (!G.boss) { spawnBoss(); G.boss.raid = true; } }
  if (r.t >= r.dur && !G.boss && !G.enemies.some(e => e.raid)) {
    const prize = 60 + 30 * r.n;
    G.gold += prize; G.raid = null;
    G.base.hp = Math.min(G.base.maxHp, G.base.hp + 300);
    banner('방어 성공!', `보상 🪙${prize} · 마을 체력 회복`, '#7bed9f', 3);
    burst(0, -20, '#ffd23f', 60, 320, 6, 1); sfx('bigBoom'); sfx('level');
  }
}

// ---------- 출격(스테이지) ----------
function enterStage() {
  const p = G.p, n = G.stageN, th = THEMES[n % THEMES.length];
  G.stash = { enemies: G.enemies, coins: G.coins, gems: G.gems, hearts: G.hearts };
  G.enemies = []; G.coins = []; G.gems = []; G.hearts = []; G.bullets = []; G.ebullets = []; G.booms = []; G.corpses = []; G.flyers = [];
  const L = 2000 + 300 * Math.min(n, 6);
  const st = { n, th, L, groups: [], deco: [], rocks: [], bossOn: false, portal: null, clear: false };
  for (let y = -380; y > -L + 520; y -= rand(240, 320)) st.groups.push({ y, done: false });
  for (let y = 120; y > -L - 420; y -= rand(55, 85)) for (const side of [-1, 1]) {
    st.deco.push({ x: side * (STAGE_HW + rand(25, 90)), y: y + rand(-20, 20), kind: th.deco, logs: 1, max: 1, shake: 0, sz: rand(0.9, 1.25), ph: Math.random() * 7 });
  }
  for (let i = 0; i < L / 120; i++) st.rocks.push({ x: rand(-STAGE_HW + 20, STAGE_HW - 20), y: rand(-L, -60), s: rand(0.6, 1.3) });
  G.st = st; G.mode = 'stage';
  p.x = 0; p.y = -40; G.cam.x = 0; G.cam.y = -52; joy = null;
  banner(`스테이지 ${n + 1} · ${th.name}`, '앞으로 나아가 보스를 물리쳐라!', '#ffd23f', 2.5);
  sfx('wave');
}
function returnBase(win) {
  const p = G.p, s = G.stash;
  G.enemies = s.enemies; G.coins = s.coins; G.gems = s.gems; G.hearts = s.hearts;
  G.bullets = []; G.ebullets = []; G.booms = []; G.corpses = []; G.flyers = []; G.boss = null;
  G.mode = 'base'; G.st = null; G.stash = null; G.gateT = 0;
  p.x = GATE.x; p.y = GATE.y - 40; G.cam.x = p.x; G.cam.y = p.y - 12;
  if (win) {
    G.stageN++; sfx('build');
    if (G.stageN % 2 === 0) { G.raidIn = 10; banner('마을로 귀환!', '적의 대군이 다가온다… 준비해!', '#ff9f1c', 3); }
    else banner('마을로 귀환!', `스테이지 ${G.stageN} 클리어 · 금화로 마을을 키우자`, '#7bed9f', 2.5);
  }
  else banner('후퇴!', '마을에서 다시 준비하자', '#ff6b6b', 2.2);
}
function updStage(dt) {
  const p = G.p, st = G.st;
  // 앞쪽 무리가 가까워지면 등장
  for (const g of st.groups) {
    if (g.done || p.y - g.y > 430) continue;
    g.done = true;
    const n = 4 + Math.min(10, st.n * 2) + Math.floor(rand(0, 3));
    for (let i = 0; i < n; i++) {
      const r = Math.random(), type = st.n >= 2 && r < 0.15 ? 'tank' : st.n >= 1 && r < 0.45 ? 'runner' : 'grunt';
      const e = makeEnemy(type, rand(-STAGE_HW + 25, STAGE_HW - 25), g.y + rand(-70, 70));
      e.hp *= 1 + st.n * 0.4; e.maxHp = e.hp;
      G.enemies.push(e);
    }
  }
  // 끝에 도착하면 보스 등장
  if (!st.bossOn && p.y < -st.L + 320) {
    st.bossOn = true;
    spawnBoss(0, -st.L - 120);
  }
  // 보스 처치 후 포털
  if (st.portal) {
    st.portal.t += dt;
    const on = !p.dead && (p.x - st.portal.x) ** 2 + (p.y - st.portal.y) ** 2 < 30 * 30;
    st.portal.on = on;
    if (on) { st.portal.hold += dt; if (st.portal.hold > 0.6) returnBase(true); } else st.portal.hold = 0;
  }
}
function drawStageGround() {
  const st = G.st, th = st.th, g = 64;
  const x0 = Math.floor((G.cam.x - VW / 2) / g) - 1, x1 = Math.ceil((G.cam.x + VW / 2) / g) + 1;
  const y0 = Math.floor((G.cam.y - VH * IK / 2) / g) - 1, y1 = Math.ceil((G.cam.y + VH * IK / 2) / g) + 2;
  ctx.fillStyle = th.edge; ctx.fillRect(x0 * g, y0 * g, (x1 - x0) * g, (y1 - y0) * g);
  const top = -st.L - 420, bot = 140;
  ctx.fillStyle = th.ground; ctx.fillRect(-STAGE_HW - 10, top, STAGE_HW * 2 + 20, bot - top);
  ctx.fillStyle = th.check;
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) if ((x + y) & 1 && Math.abs(x * g + g / 2) < STAGE_HW && y * g > top && y * g < bot) ctx.fillRect(Math.max(x * g, -STAGE_HW - 10), y * g, g, g);
  // 보스 결투장
  ctx.strokeStyle = 'rgba(255,60,60,.35)'; ctx.lineWidth = 6; ctx.setLineDash([14, 10]);
  ctx.beginPath(); ctx.arc(0, -st.L - 120, 170, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  for (const r of st.rocks) {
    if (r.y < G.cam.y - VH * IK || r.y > G.cam.y + VH * IK) continue;
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(r.x, r.y, 9 * r.s, 6 * r.s, 0, 0, 7); ctx.fill();
  }
}
function drawDeco(d) {
  if (d.kind === 'tree') { drawTree(d); return; }
  ctx.save(); ctx.translate(d.x, d.y); ctx.scale(1, IK); ctx.scale(d.sz, d.sz);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 3, 16, 6, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  if (d.kind === 'pillar') { // 무너진 돌기둥
    const h = 30 + (d.ph % 1) * 40;
    ctx.fillStyle = '#adb5bd'; ctx.fillRect(-9, -h, 18, h); ctx.strokeRect(-9, -h, 18, h);
    ctx.fillStyle = '#8d939a'; ctx.fillRect(-12, -h - 6, 24, 7); ctx.strokeRect(-12, -h - 6, 24, 7);
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.moveTo(-3, -h * 0.7); ctx.lineTo(3, -h * 0.5); ctx.lineTo(-2, -h * 0.3); ctx.stroke();
  } else { // 횃불
    ctx.fillStyle = '#4a2c12'; ctx.fillRect(-3, -34, 6, 34); ctx.strokeRect(-3, -34, 6, 34);
    const f = Math.sin(G.t * 12 + d.ph) * 2;
    ctx.fillStyle = 'rgba(255,170,40,.25)'; ctx.beginPath(); ctx.arc(0, -42, 20 + f, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff9f1c'; ctx.beginPath(); ctx.moveTo(-6, -36); ctx.quadraticCurveTo(0, -56 - f, 6, -36); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(-3, -37); ctx.quadraticCurveTo(0, -48 - f, 3, -37); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawPortal(x, y, on, label, color) {
  ctx.save(); ctx.translate(x, y);
  const pulse = 1 + Math.sin(G.t * 5) * 0.06;
  ctx.fillStyle = on ? 'rgba(255,210,63,.45)' : color; ctx.beginPath(); ctx.arc(0, 0, 28 * pulse, 0, 7); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.lineDashOffset = -G.t * 30;
  ctx.beginPath(); ctx.arc(0, 0, 28 * pulse, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  for (let i = 0; i < 3; i++) { const a = G.t * 3 + i * 2.1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(Math.cos(a) * 18, Math.sin(a) * 18, 2.5, 0, 7); ctx.fill(); }
  ctx.scale(1, IK);
  ctx.font = '900 13px system-ui,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = '#222';
  ctx.strokeText(label, 0, -30); ctx.fillStyle = '#fff'; ctx.fillText(label, 0, -30);
  ctx.restore();
}

// ---------- 전투 ----------
function nearest(x, y, maxD) {
  let best = null, bd = maxD * maxD;
  for (const e of G.enemies) { const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; best = e; } }
  return best;
}
function hurtEnemy(e, dmg, fx, fy, kb) {
  if (e.dead) return;
  const crit = Math.random() < 0.1;
  dmg = Math.round(dmg * G.p.dmgMul * (crit ? 2 : 1));
  e.hp -= dmg; e.flash = 0.1; e.hitT = 0.25; e.hx = fx; e.hy = fy;
  const k = e.boss ? kb * 0.05 : kb;
  e.kx += fx * k; e.ky += fy * k;
  floatText(e.x + rand(-6, 6), e.y - e.r - 4, crit ? dmg + '!' : '' + dmg, crit ? '#ffd23f' : '#fff', crit ? 20 : 14, 0.6);
  sfx('hit');
  if (e.hp <= 0) killEnemy(e);
}
function dropGem(x, y, v) {
  if (G.gems.length > 350) { // 너무 많으면 가장 오래된 구슬에 합치기
    const old = G.gems[0]; old.v += v; return;
  }
  G.gems.push({ x, y, v, vx: 0, vy: 0, pull: false, bob: Math.random() * 6 });
}
function dropCoin(x, y) {
  if (G.coins.length > 250) { G.gold++; return; }
  const a = Math.random() * 7;
  G.coins.push({ x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 60, z: 0, vz: rand(80, 140), pull: false, age: 0 });
}
function killEnemy(e) {
  e.dead = true; G.kills++;
  if (e.boss) { bossDie(e); return; }
  burst(e.x, e.y - 8, e.color, e.type === 'tank' ? 16 : 8, 150, 4, 0.45);
  // 맞은 방향으로 빙글빙글 날아가는 막대 인간
  if (G.corpses.length < 60) {
    const sp = rand(160, 280);
    G.corpses.push({ x: e.x, y: e.y, vx: (e.hx || 0) * sp + rand(-40, 40), vy: (e.hy || 0) * sp + rand(-40, 40), z: 0, vz: rand(160, 260), rot: 0, vr: rand(8, 16) * (Math.random() < 0.5 ? -1 : 1), life: 0.9, color: e.color, s: e.r / 11, type: e.type });
  }
  if (Math.random() < 0.13) floatText(e.x, e.y - 18, DEATH_WORDS[Math.floor(Math.random() * DEATH_WORDS.length)], e.color, 17, 0.9);
  sfx('pop');
  dropGem(e.x, e.y, e.xp);
  for (let i = 0; i < e.gold; i++) if (i > 0 || Math.random() < 0.7) dropCoin(e.x + rand(-8, 8), e.y + rand(-8, 8));
  if (Math.random() < 0.012) G.hearts.push({ x: e.x, y: e.y, bob: 0 });
}
function bossDie(e) {
  G.boss = null; G.bossKills = (G.bossKills || 0) + 1;
  for (let i = 0; i < 5; i++) burst(e.x + rand(-40, 40), e.y + rand(-40, 40), [e.color, '#ffd23f', '#fff', '#ff9f1c', '#222'][i], 40, 380, 8, 1.2);
  for (let i = 0; i < 30; i++) { const a = Math.random() * Math.PI * 2, d = rand(10, 90); dropGem(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 5); }
  for (let i = 0; i < 40 + e.lvl * 20; i++) dropCoin(e.x + rand(-40, 40), e.y + rand(-40, 40));
  G.hearts.push({ x: e.x, y: e.y, bob: 0 });
  G.shake = 25; G.slow = 1.3;
  G.ebullets.length = 0;
  banner('보스 처치!', e.name + ' 쓰러뜨렸다!', '#ffd23f', 3);
  if (G.mode === 'stage') { G.st.portal = { x: e.x, y: e.y + 60, t: 0, hold: 0, on: false }; G.st.clear = true; }
  sfx('bigBoom');
}
function hurtPlayer(dmg) {
  const p = G.p;
  if (p.inv > 0 || G.deadT > 0 || p.dead) return;
  p.hp -= dmg; p.inv = 0.7; G.shake = Math.max(G.shake, 8);
  burst(p.x, p.y - 12, '#e63946', 10, 140, 4, 0.4);
  sfx('hurt');
  if (p.hp <= 0) { // 영웅은 쓰러져도 마을에서 다시 일어남. 마을이 무너지면 게임오버
    p.hp = 0; p.dead = true; G.respawnT = 4; joy = null;
    burst(p.x, p.y - 12, '#222', 30, 220, 5, 1);
    banner('영웅이 쓰러졌다!', '곧 마을에서 다시 일어나요', '#ff6b6b', 2.2);
    sfx('over');

}
function hurtBase(dmg) {
  const b = G.base;
  if (G.deadT > 0) return;
  b.hp -= dmg; b.hitT = 0.3; G.shake = Math.max(G.shake, 5);
  burst(rand(-20, 20), rand(-30, 0), '#c0392b', 6, 120, 4, 0.4);
  sfx('baseHit');
  if (b.hp <= 0) {
    b.hp = 0; G.deadT = 2; G.baseDead = true;
    for (let i = 0; i < 4; i++) burst(rand(-30, 30), rand(-40, 10), ['#c0392b', '#8d5524', '#ffd23f', '#555'][i], 40, 300, 7, 1.2);
    banner('마을이 무너졌다…', '', '#ff6b6b', 3);
    sfx('bigBoom');
  }
}

function fireWeapons(dt) {
  const p = G.p;
  for (const id in G.weapons) {
    if (id === 'sword') continue;
    G.timers[id] = (G.timers[id] || 0) - dt;
    if (G.timers[id] > 0) continue;
    const s = wStat(id);
    const tgt = nearest(p.x, p.y, id === 'shotgun' ? 260 : 420);
    if (!tgt && id !== 'boomerang') { G.timers[id] = 0.1; continue; }
    let ang = tgt ? Math.atan2(tgt.y - (p.y - 12), tgt.x - p.x) : Math.atan2(p.ay, p.ax);
    const ox = p.x, oy = p.y - 12;
    if (id === 'pistol') {
      for (let k = 0; k < s.shots; k++) {
        const a = ang + (k - (s.shots - 1) / 2) * 0.12;
        G.bullets.push({ x: ox, y: oy, vx: Math.cos(a) * 560, vy: Math.sin(a) * 560, r: 4, dmg: s.dmg, life: 0.9, pierce: s.pierce, hits: [], kind: 'pistol' });
      }
      sfx('shoot');
    } else if (id === 'shotgun') {
      for (let k = 0; k < s.pellets; k++) {
        const a = ang + (k / (s.pellets - 1) - 0.5) * s.spread + rand(-0.04, 0.04), v = rand(420, 520);
        G.bullets.push({ x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 4, dmg: s.dmg, life: 0.42, pierce: 0, hits: [], kind: 'shot' });
      }
      burst(ox + Math.cos(ang) * 14, oy + Math.sin(ang) * 14, '#ffb347', 6, 120, 4, 0.2);
      sfx('shotgun');
    } else if (id === 'boomerang') {
      for (let k = 0; k < s.count; k++) {
        const a = ang + (k - (s.count - 1) / 2) * 0.7;
        G.booms.push({ x: ox, y: oy, dx: Math.cos(a), dy: Math.sin(a), spd: 380, dist: 0, range: s.range, back: false, dmg: s.dmg, rot: 0, hits: new Map(), life: 4 });
      }
      sfx('boom');
    }
    G.timers[id] = s.cd * p.cdMul;
  }
}

// ---------- 업데이트 ----------
function update(dt) {
  const p = G.p;
  if (G.slow > 0) { G.slow -= dt; dt *= 0.35; }
  if (G.deadT > 0) { G.deadT -= dt; if (G.deadT <= 0) { gameOver(); return; } dt *= 0.4; }
  G.t += dt;

  // 쓰러진 영웅 부활
  if (p.dead) {
    G.respawnT -= dt;
    if (G.respawnT <= 0) {
      if (G.mode === 'stage') returnBase(false);
      p.dead = false; p.hp = p.maxHp; p.inv = 2; p.x = 0; p.y = 60;
      burst(p.x, p.y - 12, '#ffd23f', 30, 220, 5, 0.7); sfx('level');
      banner('영웅 부활!', '', '#ffd23f', 1.2);
    }
  }
  // 플레이어 이동
  if (G.deadT <= 0 && !p.dead) {
    const d = inputDir();
    p.moving = Math.abs(d.x) + Math.abs(d.y) > 0.05;
    if (p.moving) {
      p.x += d.x * p.speed * dt; p.y += d.y * p.speed * dt;
      const l = Math.hypot(d.x, d.y); p.ax = d.x / l; p.ay = d.y / l;
      if (Math.abs(d.x) > 0.1) p.face = d.x > 0 ? 1 : -1;
      p.walk += dt * 12 * Math.min(1, l + 0.3);
      if (G.mode === 'base') {
        const pr = Math.hypot(p.x, p.y), lim = MAP_R - 15;
        if (pr > lim) { p.x *= lim / pr; p.y *= lim / pr; }
      } else {
        p.x = clamp(p.x, -STAGE_HW + 12, STAGE_HW - 12); p.y = clamp(p.y, -G.st.L - 380, 100);
      }
    }
  }
  G.base.hitT -= dt;

  p.chop = Math.max(0, p.chop - dt); p.fullMsg -= dt;
  if (G.mode === 'stage') { updStage(dt); G.hint = G.st && G.st.portal ? { x: G.st.portal.x, y: G.st.portal.y, text: '🌀 포털에 서면 마을로 귀환!' } : null; }
  else updBase(dt);
  p.inv = Math.max(0, p.inv - dt);


  if (G.deadT <= 0 && !p.dead) fireWeapons(dt);

  // 회전 칼
  if (G.weapons.sword && !p.dead) {
    const s = wStat('sword');
    G.swordAng += s.spd * dt;
    for (let k = 0; k < s.n; k++) {
      const a = G.swordAng + k / s.n * Math.PI * 2;
      const bx = p.x + Math.cos(a) * s.rad, by = p.y - 12 + Math.sin(a) * s.rad;
      for (const e of G.enemies) {
        if (e.dead || e.swordCd > 0) continue;
        const rr = e.r + 16;
        if ((e.x - bx) ** 2 + (e.y - by) ** 2 < rr * rr) {
          e.swordCd = 0.35;
          hurtEnemy(e, s.dmg, Math.cos(a), Math.sin(a), 260);
          burst(bx, by, '#dff6ff', 3, 120, 3, 0.2);
          sfx('swing');
        }
      }
    }
  }

  // 총알
  for (const b of G.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of G.enemies) {
      if (e.dead || b.life <= 0) continue;
      const rr = e.r + b.r;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr && !b.hits.includes(e.id)) {
        b.hits.push(e.id);
        const l = Math.hypot(b.vx, b.vy);
        hurtEnemy(e, b.dmg, b.vx / l, b.vy / l, b.kind === 'shot' ? 220 : 140);
        if (b.pierce-- <= 0) b.life = 0;
      }
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);

  // 부메랑
  for (const b of G.booms) {
    b.rot += dt * 18; b.life -= dt;
    if (!b.back) {
      const sp = b.spd * Math.max(0.25, 1 - b.dist / b.range * 0.7);
      b.x += b.dx * sp * dt; b.y += b.dy * sp * dt; b.dist += sp * dt;
      if (b.dist >= b.range) b.back = true;
    } else {
      const dx = p.x - b.x, dy = p.y - 12 - b.y, d = Math.hypot(dx, dy) || 1;
      b.x += dx / d * 420 * dt; b.y += dy / d * 420 * dt;
      if (d < 18) b.life = 0;
    }
    for (const e of G.enemies) {
      if (e.dead) continue;
      const rr = e.r + 13;
      if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr && G.t - (b.hits.get(e.id) || -9) > 0.4) {
        b.hits.set(e.id, G.t);
        hurtEnemy(e, b.dmg, b.back ? -b.dx : b.dx, b.back ? -b.dy : b.dy, 180);
      }
    }
  }
  G.booms = G.booms.filter(b => b.life > 0);

  // 적
  for (const e of G.enemies) {
    if (e.dead) continue;
    e.flash -= dt; e.hitT -= dt; e.swordCd -= dt; e.lunge -= dt; e.wob += dt * (e.hitT > 0 ? 3 : 9);
    const pdx = p.x - e.x, pdy = p.y - 6 - e.y, pd = Math.hypot(pdx, pdy) || 1;
    // 마을: 영웅이 가까우면 영웅을, 아니면 마을을 노림 / 스테이지: 영웅을 발견하면 쫓아옴
    let chase = !p.dead && pd < (e.boss ? 260 : 170);
    if (G.mode === 'stage') { if (pd < 300) e.awake = true; chase = !p.dead && (e.awake || e.boss); }
    const idle = G.mode === 'stage' && !chase;
    const dx = idle ? Math.cos(e.wob * 0.05) : chase ? pdx : -e.x, dy = idle ? Math.sin(e.wob * 0.07) : chase ? pdy : -e.y, d = Math.hypot(dx, dy) || 1;
    if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
    if (e.boss) updBoss(e, dt, dx, dy, d);
    else {
      const sp = (e.hitT > 0 ? 0.35 : 1) * (idle ? 0.15 : 1) * e.spd;
      e.x += dx / d * sp * dt; e.y += dy / d * sp * dt;
    }
    e.x += e.kx * dt; e.y += e.ky * dt;
    const decay = Math.exp(-9 * dt); e.kx *= decay; e.ky *= decay;
    if (!p.dead && pd < e.r + p.r + 2) hurtPlayer(e.dmg);
  }
  // 겹침 방지
  const es = G.enemies;
  for (let i = 0; i < es.length; i++) {
    const a = es[i];
    for (let j = i + 1; j < es.length; j++) {
      const b = es[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 < rr * rr && d2 > 0.01) {
        const d = Math.sqrt(d2), push = (rr - d) * 0.5, nx = dx / d, ny = dy / d;
        const wa = a.boss ? 0 : b.boss ? 1 : 0.5, wb = 1 - wa;
        a.x -= nx * push * wa * 2; a.y -= ny * push * wa * 2;
        b.x += nx * push * wb * 2; b.y += ny * push * wb * 2;
      }
    }
  }
  // 울타리에 막히면 울타리를 부수고, 마을 회관에 닿으면 회관을 공격
  for (const e of es) {
    if (e.dead) continue;
    if (G.mode === 'stage') { e.x = clamp(e.x, -STAGE_HW + 8, STAGE_HW - 8); continue; }
    const dB = Math.hypot(e.x, e.y) || 1, w = G.walls[segOf(e.x, e.y)], m = e.r * 0.6;
    let blocked = false;
    if (w.hp > 0) {
      if (!e.inside && dB < WALL_R + m) { const k = (WALL_R + m) / dB; e.x *= k; e.y *= k; blocked = true; }
      else if (e.inside && dB > WALL_R - m) { const k = (WALL_R - m) / dB; e.x *= k; e.y *= k; blocked = true; }
    } else e.inside = dB < WALL_R;
    if (blocked) {
      if (e.boss && e.mode === 'dash') { e.mode = 'walk'; e.st = 1.5; w.hp -= 120; G.shake = 12; }
      attackTarget(e, dt, () => {
        w.hp -= e.dmg * (e.boss ? 2 : 1); w.shake = 0.2; sfx('thud');
        burst(e.x * WALL_R / dB, e.y * WALL_R / dB, '#c68642', 3, 90, 3, 0.3);
        if (w.hp <= 0) {
          w.hp = 0; sfx('break'); G.shake = Math.max(G.shake, 6);
          burst(e.x * WALL_R / dB, e.y * WALL_R / dB, '#8d5524', 18, 200, 5, 0.6);
          floatText(e.x, e.y - 30, '와장창!', '#ffd23f', 20, 1);
        }
      });
    }
    if (dB < BASE_R + e.r) {
      const k = (BASE_R + e.r) / dB; e.x *= k; e.y *= k;
      attackTarget(e, dt, () => hurtBase(e.dmg));
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
  for (const c of G.corpses) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.vz -= 600 * dt; c.z = Math.max(0, c.z + c.vz * dt);
    c.rot += c.vr * dt; c.life -= dt; c.vx *= 0.97; c.vy *= 0.97;
  }
  G.corpses = G.corpses.filter(c => c.life > 0);

  // 금화
  for (const c of G.coins) {
    c.age += dt;
    if (c.z > 0 || c.vz > 0) { c.x += c.vx * dt; c.y += c.vy * dt; c.vz -= 500 * dt; c.z = Math.max(0, c.z + c.vz * dt); if (c.z === 0) c.vz = 0; continue; }
    if (p.dead) continue;
    const dx = p.x - c.x, dy = p.y - 10 - c.y, d = Math.hypot(dx, dy) || 1;
    if (d < p.magnet * 1.3 || c.pull || c.age > 5) {
      c.pull = true; const sp = 300 + Math.max(0, 200 - d) * 3;
      c.x += dx / d * sp * dt; c.y += dy / d * sp * dt;
    }
    if (d < 16) { c.dead = true; G.gold++; sfx('coin'); }
  }
  G.coins = G.coins.filter(c => !c.dead);

  // 보스 탄
  for (const b of G.ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (G.mode === 'base' && b.x * b.x + b.y * b.y < (BASE_R + b.r) ** 2) { hurtBase(b.dmg); b.life = 0; continue; }
    if (!p.dead && (b.x - p.x) ** 2 + (b.y - p.y + 12) ** 2 < (b.r + p.r) ** 2) { hurtPlayer(b.dmg); b.life = 0; }
  }
  G.ebullets = G.ebullets.filter(b => b.life > 0);

  // 구슬
  for (const g of G.gems) {
    g.bob += dt * 4; g.age = (g.age || 0) + dt;
    if (p.dead) continue;
    const dx = p.x - g.x, dy = p.y - 10 - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < p.magnet || g.pull || g.age > 6) {
      g.pull = true;
      const sp = 260 + (p.magnet - Math.min(d, p.magnet)) * 4;
      g.x += dx / d * sp * dt; g.y += dy / d * sp * dt;
    }
    if (d < 16) { g.dead = true; G.xp += g.v; sfx('gem'); }
  }
  G.gems = G.gems.filter(g => !g.dead);
  for (const h of G.hearts) {
    h.bob += dt * 4;
    if (!p.dead && (p.x - h.x) ** 2 + (p.y - 10 - h.y) ** 2 < 24 * 24) {
      h.dead = true; p.hp = Math.min(p.maxHp, p.hp + 30);
      floatText(p.x, p.y - 40, '+30', '#2ecc71', 20, 0.9); burst(p.x, p.y - 12, '#ff6b9a', 14, 120, 4, 0.5); sfx('heal');
    }
  }
  G.hearts = G.hearts.filter(h => !h.dead);

  // 레벨업
  while (G.xp >= G.need) {
    G.xp -= G.need; G.lvl++; G.need = xpNeed(G.lvl); G.pending++;
  }

  // 이펙트
  for (const q of G.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92; q.life -= dt; }
  G.parts = G.parts.filter(q => q.life > 0);
  for (const t of G.texts) { t.y -= 40 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  G.shake = Math.max(0, G.shake - dt * 30);
  G.lvlFlash = Math.max(0, G.lvlFlash - dt);

  // 카메라
  const fx = (p.dead && G.mode === 'base') || G.baseDead ? 0 : p.x, fy = (p.dead && G.mode === 'base') || G.baseDead ? 0 : p.y - 12;
  G.cam.x += (fx - G.cam.x) * Math.min(1, dt * (p.dead ? 3 : 8));
  G.cam.y += (fy - G.cam.y) * Math.min(1, dt * (p.dead ? 3 : 8));

  if (G.pending > 0 && G.deadT <= 0 && !p.dead) {
    G.lvlFlash = 0.6; burst(p.x, p.y - 12, '#ffd23f', 30, 260, 5, 0.6); sfx('level');
    openLevelUp();
  }
}

function updBoss(e, dt, dx, dy, d) {
  e.st -= dt;
  if (e.mode === 'walk') {
    e.x += dx / d * e.spd * dt; e.y += dy / d * e.spd * dt;
    if (e.st <= 0) {
      const r = Math.random();
      if (r < 0.4) { e.mode = 'aim'; e.st = 0.9; sfx('warn'); }
      else if (r < 0.75) { e.mode = 'ring'; e.st = 0.3; e.rings = 2 + Math.min(3, e.lvl); }
      else {
        e.mode = 'summon'; e.st = 0.8;
        for (let i = 0; i < 6 + e.lvl * 2; i++) { const a = i / (6 + e.lvl * 2) * Math.PI * 2; G.enemies.push(makeEnemy('runner', e.x + Math.cos(a) * 80, e.y + Math.sin(a) * 80)); }
        burst(e.x, e.y, e.color, 30, 260, 6, 0.6); floatText(e.x, e.y - 80, '나와라 부하들!', '#fff', 18, 1.2);
      }
    }
  } else if (e.mode === 'aim') {
    e.ax = dx / d; e.ay = dy / d;
    if (e.st <= 0) { e.mode = 'dash'; e.st = 0.6; sfx('dash'); G.shake = 10; }
  } else if (e.mode === 'dash') {
    e.x += e.ax * 520 * dt; e.y += e.ay * 520 * dt;
    if (Math.random() < 0.7) G.parts.push({ x: e.x + rand(-30, 30), y: e.y + rand(-30, 30), vx: 0, vy: 0, life: 0.4, max: 0.4, color: e.color, size: 10 });
    if (e.st <= 0) { e.mode = 'walk'; e.st = rand(1.8, 2.8); }
  } else if (e.mode === 'ring') {
    if (e.st <= 0) {
      const n = 16, off = Math.random() * Math.PI;
      for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; G.ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 8, dmg: 12 + e.lvl * 4, life: 5 }); }
      G.shake = Math.max(G.shake, 5); sfx('shotgun');
      e.rings--; e.st = 0.45;
      if (e.rings <= 0) { e.mode = 'walk'; e.st = rand(2, 3); }
    }
  } else if (e.mode === 'summon') {
    if (e.st <= 0) { e.mode = 'walk'; e.st = rand(2, 3); }
  }
}

// ---------- 그리기 ----------
function drawGround() {
  const g = 64, x0 = Math.floor((G.cam.x - VW / 2) / g) - 1, x1 = Math.ceil((G.cam.x + VW / 2) / g) + 1;
  const y0 = Math.floor((G.cam.y - VH * IK / 2) / g) - 1, y1 = Math.ceil((G.cam.y + VH * IK / 2) / g) + 2;
  // 바깥 숲
  ctx.fillStyle = '#3f7d3a'; ctx.fillRect(x0 * g, y0 * g, (x1 - x0) * g, (y1 - y0) * g);
  // 풀밭
  ctx.fillStyle = '#8fd16a'; ctx.beginPath(); ctx.arc(0, 0, MAP_R, 0, 7); ctx.fill();
  ctx.strokeStyle = '#6fb34e'; ctx.lineWidth = 10; ctx.stroke();
  // 체크무늬 잔디
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) if ((x + y) & 1) ctx.fillRect(x * g, y * g, g, g);
  // 마을 마당
  ctx.fillStyle = '#e3c58f'; ctx.beginPath(); ctx.arc(0, 0, WALL_R - 6, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(150,110,60,.35)'; ctx.lineWidth = 4; ctx.stroke();
  // 칸마다 고정된 풀·꽃·나무 장식
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    const h = Math.abs(Math.sin(x * 127.1 + y * 311.7) * 43758.5) % 1;
    const px = x * g + (h * 300) % g, py = y * g + (h * 700) % g, r = Math.hypot(px, py);
    if (r > MAP_R + 20) { // 숲 나무
      if (h < 0.7) {
        ctx.save(); ctx.translate(px, py); ctx.scale(1, IK);
        ctx.fillStyle = h < 0.35 ? '#2d6a2e' : '#357a36'; ctx.beginPath(); ctx.arc(0, -10, 22 + h * 10, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(-7, -18, 9, 0, 7); ctx.fill();
        ctx.restore();
      }
      continue;
    }
    if (r < WALL_R + 10 || r > MAP_R - 10) continue;
    if (h < 0.22) {
      ctx.strokeStyle = 'rgba(40,110,40,.55)'; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(px - 4, py); ctx.lineTo(px - 6, py - 7); ctx.moveTo(px, py); ctx.lineTo(px, py - 9); ctx.moveTo(px + 4, py); ctx.lineTo(px + 6, py - 7); ctx.stroke();
    } else if (h < 0.3) {
      ctx.fillStyle = h < 0.26 ? '#fff' : '#ffd23f';
      for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(px + Math.cos(k * 1.26) * 3, py + Math.sin(k * 1.26) * 3, 2.2, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(px, py, 1.8, 0, 7); ctx.fill();
    } else if (h < 0.34) {
      ctx.fillStyle = '#9aa0a6'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(px, py, 7, 5, 0, 0, 7); ctx.fill(); ctx.stroke();
    }
  }
}

function drawWallSeg(i) {
  const lvl = G.wallLvl, stone = lvl >= 4;
  {
    const w = G.walls[i], a0 = i / WALL_SEGS * Math.PI * 2, a1 = (i + 1) / WALL_SEGS * Math.PI * 2;
    const n = 5, sh = w.shake > 0 ? rand(-1.5, 1.5) : 0;
    if (w.hp <= 0) { // 부서진 울타리 그루터기
      for (let k = 0; k < n; k++) {
        const a = a0 + (k + 0.5) / n * (a1 - a0), x = Math.cos(a) * WALL_R, y = Math.sin(a) * WALL_R;
        ctx.fillStyle = '#7a4a22'; ctx.fillRect(x - 3, y - 4, 6, 6);
      }
      return;
    }
    const dmg = 1 - w.hp / w.maxHp, hgt = 20 + lvl * 2;
    // 가로대 (말뚝 높이의 중간)
    ctx.strokeStyle = stone ? '#6c757d' : '#6b3e1a'; ctx.lineWidth = 4;
    ctx.beginPath();
    for (let k = 0; k <= 8; k++) { const a = a0 + k / 8 * (a1 - a0), x = Math.cos(a) * WALL_R + sh, y = Math.sin(a) * WALL_R - hgt * 0.5 * IK; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    for (let k = 0; k < n; k++) {
      const a = a0 + (k + 0.5) / n * (a1 - a0), x = Math.cos(a) * WALL_R + sh, y = Math.sin(a) * WALL_R;
      const tilt = dmg > 0.5 && k % 2 ? 0.35 : 0;
      ctx.save(); ctx.translate(x, y); ctx.scale(1, IK); ctx.rotate(tilt);
      ctx.fillStyle = stone ? '#adb5bd' : lvl >= 2 ? '#b5733a' : '#c68642'; ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-4.5, 2); ctx.lineTo(-4.5, -hgt + 5); ctx.lineTo(0, -hgt); ctx.lineTo(4.5, -hgt + 5); ctx.lineTo(4.5, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(1.5, -hgt + 5, 3, hgt - 3);
      ctx.restore();
    }
    if (w.hp < w.maxHp) {
      const am = (a0 + a1) / 2, x = Math.cos(am) * (WALL_R + 16), y = Math.sin(am) * (WALL_R + 16);
      ctx.fillStyle = '#222'; ctx.fillRect(x - 13, y - 3, 26, 6);
      ctx.fillStyle = w.hp / w.maxHp > 0.4 ? '#f4a261' : '#e63946'; ctx.fillRect(x - 12, y - 2, 24 * w.hp / w.maxHp, 4);
    }
  }
}

function drawTree(t) {
  const sh = t.shake > 0 ? Math.sin(t.shake * 60) * 3 : 0;
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(1, IK);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 3, 20 * t.sz, 7, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#3d2210'; ctx.lineWidth = 2.5;
  if (t.logs <= 0) { // 그루터기
    ctx.fillStyle = '#8d5524'; ctx.beginPath(); ctx.rect(-8, -8, 16, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e3c58f'; ctx.beginPath(); ctx.ellipse(0, -8, 8, 3.5, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore(); return;
  }
  ctx.scale(t.sz, t.sz); ctx.translate(sh, 0);
  ctx.fillStyle = '#8d5524'; ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(-5, -26); ctx.lineTo(5, -26); ctx.lineTo(6, 2); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(-5, -50, 6, 0, 7); ctx.fill();

}

function drawBase() {
  const b = G.base, sh = b.hitT > 0 ? rand(-2, 2) : 0;
  ctx.save(); ctx.translate(sh, 0); ctx.scale(1, IK);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, 18, 38, 10, 0, 0, 7); ctx.fill();
  ctx.fillStyle = b.hitT > 0.2 ? '#fff' : '#f1e3c8'; ctx.strokeStyle = '#4a2c12'; ctx.lineWidth = 3;
  ctx.fillRect(-28, -22, 56, 40); ctx.strokeRect(-28, -22, 56, 40);
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(-36, -20); ctx.lineTo(0, -48); ctx.lineTo(36, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#8d5524'; ctx.fillRect(-8, -2, 16, 20); ctx.strokeRect(-8, -2, 16, 20);
  ctx.fillStyle = '#7ec8e3'; ctx.fillRect(-22, -14, 10, 9); ctx.strokeRect(-22, -14, 10, 9); ctx.fillRect(12, -14, 10, 9); ctx.strokeRect(12, -14, 10, 9);
  // 깃발
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(0, -74); ctx.stroke();

  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(0, -74); ctx.quadraticCurveTo(12, -72 + f, 22, -68); ctx.lineTo(0, -62); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (b.hp < b.maxHp) {

function drawPads() {
  for (const pd of G.pads) {
    const cost = padCost(pd);
    if (!cost) continue;
    const r = 24, on = pd.on;
    ctx.save(); ctx.translate(pd.x, pd.y + padOY(pd));
    ctx.fillStyle = on ? 'rgba(255,210,63,.5)' : 'rgba(255,255,255,.35)';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -G.t * 15;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    const done = (pd.pw + pd.pg) / (cost.w + cost.g || 1);
    if (done > 0) {
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * done); ctx.stroke();
    }
    ctx.scale(1, IK);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = '#222';
    ctx.font = '900 12px system-ui,sans-serif';
    const lb = padLabel(pd); ctx.strokeText(lb, 0, -r * K - 12); ctx.fillStyle = '#fff'; ctx.fillText(lb, 0, -r * K - 12);
    const parts = [];
    if (cost.w) parts.push(['🪵' + (cost.w - pd.pw), '#ffe0b3']);
    if (cost.g) parts.push(['🪙' + (cost.g - pd.pg), '#ffd23f']);
    ctx.font = '900 12px system-ui,sans-serif';
    parts.forEach((pt, i) => { const y = (i - (parts.length - 1) / 2) * 14; ctx.strokeText(pt[0], 0, y); ctx.fillStyle = pt[1]; ctx.fillText(pt[0], 0, y); });
    ctx.restore();
  }
}

function drawStick(p) {
  const blink = p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(1, IK);
  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 14, 13, 4, 0, 0, 7); ctx.fill();
  ctx.scale(p.face, 1);
  const col = blink ? '#e63946' : '#1d1d1d';
  const sw = p.moving ? Math.sin(p.walk) : 0, bob = p.moving ? Math.abs(Math.cos(p.walk)) * 2 : Math.sin(G.t * 3) * 0.8;
  ctx.strokeStyle = col; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hipY = -2 - bob, neckY = -18 - bob;
  if (SPR.hero) { // 그림 주인공: 통통 튀며 걷고, 도끼질 때는 몸을 기울임
    for (let i = 0; i < p.logs; i++) drawLog(-12 + (i % 2) * 1.5, -14 - bob - i * 4.6, 0.85);
    const img = SPR.hero, h = 64, ax = SPR_INFO.hero.ax, w = h * img.width / img.height;
    const ch = p.chop > 0 ? Math.sin((1 - p.chop / 0.2) * Math.PI) : 0;
    const tilt = p.moving ? sw * 0.08 : 0;
    ctx.save(); ctx.translate(0, 14); ctx.rotate(tilt + ch * 0.35);
    const sq = p.moving ? 1 + Math.abs(Math.cos(p.walk)) * 0.04 : 1 + Math.sin(G.t * 3) * 0.015;
    ctx.scale(2 - sq, sq);
    if (blink) ctx.globalAlpha = 0.35;
    ctx.drawImage(img, -w * ax, -h - bob, w, h); // 몸 중심이 발 위에 오도록 (칼 쪽이 더 넓음)
    ctx.restore(); ctx.restore();
    return;
  }
  // 등에 짊어진 통나무 더미
  for (let i = 0; i < p.logs; i++) drawLog(-7 + (i % 2) * 1.5, neckY + 6 - i * 4.6, 0.85);
  ctx.strokeStyle = col; ctx.lineWidth = 3.4;
  ctx.beginPath();
  // 다리
  ctx.moveTo(0, hipY); ctx.lineTo(-3 + sw * 7, 13);
  ctx.moveTo(0, hipY); ctx.lineTo(3 - sw * 7, 13);
  // 몸통
  ctx.moveTo(0, hipY); ctx.lineTo(0, neckY);
  // 팔
  ctx.moveTo(0, neckY + 4); ctx.lineTo(-7 - sw * 4, neckY + 13);
  const ch = p.chop > 0 ? Math.sin((1 - p.chop / 0.2) * Math.PI) : -1;
  if (ch > -1) ctx.moveTo(0, neckY + 4), ctx.lineTo(7 + ch * 4, neckY + 2 + ch * 8);
  else ctx.moveTo(0, neckY + 4), ctx.lineTo(8 + sw * 3, neckY + 11);
  ctx.stroke();
  if (ch > -1) { // 도끼질
    const hx = 7 + ch * 4, hy = neckY + 2 + ch * 8, a = -0.9 + ch * 1.8;
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(a);
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.stroke();
    ctx.fillStyle = '#ced4da'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(7, -16); ctx.lineTo(7, -8); ctx.lineTo(0, -10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // 머리
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, neckY - 8, 7.5, 0, 7); ctx.fill(); ctx.stroke();
  // 영웅 머리띠
  ctx.strokeStyle = '#e63946'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-7, neckY - 10); ctx.lineTo(7, neckY - 10); ctx.stroke();
  const fl = Math.sin(G.t * 14) * 3;
  ctx.beginPath(); ctx.moveTo(-6, neckY - 10); ctx.quadraticCurveTo(-14, neckY - 12 + fl, -20, neckY - 8 - fl); ctx.stroke();
  // 눈
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(3, neckY - 8, 1.6, 0, 7); ctx.fill();
  ctx.restore();
}

function drawStickman(x, y, o) {
  // o: {color, s(크기), face, phase, hit, flash, lunge, type, rot, z, alpha}
  ctx.save(); ctx.translate(x, y); ctx.scale(1, IK);
  if (!o.rot) { ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(0, 12 * o.s, 10 * o.s, 3.5 * o.s, 0, 0, 7); ctx.fill(); }
  ctx.translate(0, -(o.z || 0));
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.rot) ctx.rotate(o.rot);
  ctx.scale(o.face * o.s, o.s);
  const col = o.flash ? '#fff' : o.color, sw = Math.sin(o.phase), ln = Math.max(0, o.lunge) * 30;
  ctx.strokeStyle = o.flash ? '#888' : col; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -2); ctx.lineTo(-3 + sw * 6, 12); ctx.moveTo(0, -2); ctx.lineTo(3 - sw * 6, 12);
  ctx.moveTo(0, -2); ctx.lineTo(1, -15);
  ctx.moveTo(1, -12); ctx.lineTo(8 + ln, -8 - sw * 2); ctx.moveTo(1, -12); ctx.lineTo(6 + ln * 0.6, -5 + sw * 2);
  ctx.stroke();
  if (o.type === 'tank') { // 나무 방패
    ctx.fillStyle = '#8d5524'; ctx.strokeStyle = '#3d2210'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(9 + ln, -8, 4, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
  } else { // 몽둥이
    ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8 + ln, -8 - sw * 2); ctx.lineTo(12 + ln, -18 - sw * 2); ctx.stroke();
  }
  // 머리
  ctx.fillStyle = col; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(1, -21, 6.5, 0, 7); ctx.fill(); ctx.stroke();
  if (o.type === 'tank') { ctx.fillStyle = '#9aa0a6'; ctx.beginPath(); ctx.arc(1, -22, 7, Math.PI, 0); ctx.fill(); ctx.stroke(); }
  if (o.hit) {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.4; ctx.beginPath();
    ctx.moveTo(1, -24); ctx.lineTo(4, -21); ctx.lineTo(1, -18); ctx.moveTo(8, -24); ctx.lineTo(5, -21); ctx.lineTo(8, -18); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(2.5, -21, 2.3, 0, 7); ctx.arc(6.5, -21, 2.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(3.4, -21, 1.1, 0, 7); ctx.arc(7.4, -21, 1.1, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(0.5, -25.5); ctx.lineTo(4, -23.8); ctx.moveTo(8.8, -25.5); ctx.lineTo(5.5, -23.8); ctx.stroke();
  }
  ctx.restore();
}
function drawSpriteMan(n, x, y, o) {
  // 그림 적: 걸을 때 좌우로 흔들·통통, 맞으면 찌그러지며 하얗게 번쩍, 쓰러지면 빙글빙글
  const img = SPR[n], inf = SPR_INFO[n], h = inf.h, w = h * img.width / img.height;
  ctx.save(); ctx.translate(x, y); ctx.scale(1, IK);
  if (!o.rot) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 2, h * 0.24, h * 0.08, 0, 0, 7); ctx.fill(); }
  ctx.translate(Math.max(0, o.lunge || 0) * 24 * o.face, -(o.z || 0));
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.rot) { ctx.translate(0, -h / 2); ctx.rotate(o.rot); ctx.translate(0, h / 2); }
  // (걸을 때 회전은 많이 그리면 느려서 빼고, 통통 튀기·찌그러짐으로만 표현)
  const sq = o.hit ? 1 + Math.sin(o.hitT * 40) * 0.12 : 1 + Math.abs(Math.cos(o.phase)) * 0.05;
  ctx.scale(o.face * (2 - sq), sq);
  ctx.drawImage(o.flash && SPR_WHITE[n] ? SPR_WHITE[n] : img, -w * inf.ax, -h - Math.abs(Math.sin(o.phase)) * 3, w, h);
  ctx.restore();
}
function drawEnemy(e) {
  if (SPR[e.type]) drawSpriteMan(e.type, e.x, e.y, { face: e.face, phase: e.wob, hit: e.hitT > 0, hitT: e.hitT, flash: e.flash > 0, lunge: e.lunge });
  else drawStickman(e.x, e.y, { color: e.color, s: e.r / 11, face: e.face, phase: e.wob, hit: e.hitT > 0, flash: e.flash > 0, lunge: e.lunge, type: e.type });

    ctx.fillStyle = '#e63946'; ctx.fillRect(e.x - 15, by + 1, 30 * Math.max(0, e.hp / e.maxHp), 3);
