}

function drawBoss(e) {
  ctx.save();
  if (e.mode === 'aim') { // 돌진 경고선
    ctx.strokeStyle = `rgba(255,40,40,${0.35 + 0.35 * Math.sin(G.t * 30)})`; ctx.lineWidth = e.r * 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.ax * 330, e.y + e.ay * 330); ctx.stroke();
  }
  ctx.translate(e.x, e.y); ctx.scale(1, IK);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0, e.r * 0.9, e.r, e.r * 0.3, 0, 0, 7); ctx.fill();
  const pulse = e.mode === 'aim' ? 1 + Math.sin(G.t * 40) * 0.05 : 1 + Math.sin(G.t * 5) * 0.04;
  ctx.scale(pulse, 2 - pulse);
  if (SPR[e.spr]) { // 그림 보스: 바닥(발)이 e.y + r 근처, 돌진 준비 땐 하얗게 깜빡이며 부풀어 오름
    const img = SPR[e.spr], h = SPR_INFO[e.spr].h, w = h * img.width / img.height, top = e.r * 0.95 - h;
    ctx.drawImage(img, -w / 2, top, w, h);
    const glow = e.mode === 'aim' ? 0.25 + 0.25 * Math.sin(G.t * 30) : e.flash > 0 ? 0.45 : 0; // 보스는 반투명하게만 번쩍
    if (glow > 0 && SPR_WHITE[e.spr]) { ctx.globalAlpha = glow; ctx.drawImage(SPR_WHITE[e.spr], -w / 2, top, w, h); }
    ctx.restore();
    return;
  }
  // 몸통 + 뿔
  ctx.fillStyle = e.flash > 0 ? '#fff' : e.color; ctx.strokeStyle = '#222'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-e.r * 0.6, -e.r * 0.7); ctx.lineTo(-e.r * 0.85, -e.r * 1.35); ctx.lineTo(-e.r * 0.2, -e.r * 0.95);
  ctx.moveTo(e.r * 0.6, -e.r * 0.7); ctx.lineTo(e.r * 0.85, -e.r * 1.35); ctx.lineTo(e.r * 0.2, -e.r * 0.95); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7); ctx.fill(); ctx.stroke();
  // 왕관
  ctx.fillStyle = '#ffd23f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-22, -e.r + 4); ctx.lineTo(-22, -e.r - 18); ctx.lineTo(-11, -e.r - 6); ctx.lineTo(0, -e.r - 24); ctx.lineTo(11, -e.r - 6); ctx.lineTo(22, -e.r - 18); ctx.lineTo(22, -e.r + 4); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 얼굴
  const dx = G.p.x - e.x, dy = G.p.y - e.y, d = Math.hypot(dx, dy) || 1, lx = dx / d * 5, ly = dy / d * 5;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-20, -10, 13, 0, 7); ctx.arc(20, -10, 13, 0, 7); ctx.fill();
  ctx.fillStyle = e.mode === 'aim' || e.mode === 'dash' ? '#e00' : '#222';
  ctx.beginPath(); ctx.arc(-20 + lx, -10 + ly, 6, 0, 7); ctx.arc(20 + lx, -10 + ly, 6, 0, 7); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-36, -32); ctx.lineTo(-8, -20); ctx.moveTo(36, -32); ctx.lineTo(8, -20); ctx.stroke();
  // 이빨 입
  ctx.fillStyle = '#5a0a0a'; ctx.beginPath(); ctx.ellipse(0, 22, 24, e.mode === 'ring' ? 16 : 10, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 9 - 4, 13); ctx.lineTo(i * 9 + 4, 13); ctx.lineTo(i * 9, 20); ctx.fill(); }
  ctx.restore();
}

function drawWorld() {
  const p = G.p, base = G.mode === 'base';
  if (base) {
    drawPads();
    if (G.gateOpen) drawPortal(GATE.x, GATE.y, G.gateT > 0, G.gateT > 0 ? `출격 ${Math.ceil((1 - G.gateT) * 10) / 10}` : '⚔ 출격!', 'rgba(230,57,70,.35)');
  } else if (G.st.portal) drawPortal(G.st.portal.x, G.st.portal.y, G.st.portal.on, '🌀 마을로', 'rgba(63,169,245,.45)');
  // 금화
  for (const c of G.coins) {
    const y = c.y - c.z, sq = Math.abs(Math.cos(c.age * 6 + c.x));
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(c.x, c.y + 4, 5, 2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(c.x, y, 5.5 * (0.35 + 0.65 * sq), 5.5, 0, 0, 7); ctx.fill(); ctx.stroke();
  }
  // 구슬
  for (const g of G.gems) {
    const c = g.v >= 20 ? '#ff4d6d' : g.v >= 5 ? '#2ecc71' : '#3fa9f5', s = g.v >= 5 ? 6.5 : 5, y = g.y + Math.sin(g.bob) * 2;
    ctx.fillStyle = c; ctx.strokeStyle = '#1d3557'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(g.x, y - s * 1.3); ctx.lineTo(g.x + s, y); ctx.lineTo(g.x, y + s * 1.3); ctx.lineTo(g.x - s, y); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(g.x - 1.5, y - s * 0.7, 2, 3);
  }
  for (const h of G.hearts) {
    ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save(); ctx.translate(h.x, h.y + Math.sin(h.bob) * 3); ctx.scale(1, IK); ctx.fillText('❤️', 0, -8); ctx.restore();
  }
  // 마을·망루·적·영웅을 y 순서로
  const list = G.enemies.slice();
  const vis = o => o.y > G.cam.y - VH * IK / 2 - 80 && o.y < G.cam.y + VH * IK / 2 + 60;
  if (base) {
    if (!G.baseDead) list.push({ y: 14, draw: drawBase });
    for (let i = 0; i < WALL_SEGS; i++) { const am = (i + 0.5) / WALL_SEGS * Math.PI * 2; list.push({ y: Math.sin(am) * WALL_R, draw: () => drawWallSeg(i) }); }
    for (const t of G.trees) if (vis(t)) list.push({ y: t.y, draw: () => drawTree(t) });
    for (const t of G.towers) if (t.lvl) list.push({ y: t.y + 4, draw: () => drawTower(t) });
    if (G.smith) list.push({ y: SMITH.y + 6, draw: drawSmith });
  } else for (const d of G.st.deco) if (vis(d)) list.push({ y: d.y, draw: () => drawDeco(d) });
  if (!p.dead && G.deadT <= 0) list.push({ y: p.y, draw: () => drawStick(p) });
  list.sort((a, b) => a.y - b.y);
  for (const e of list) { if (e.draw) e.draw(); else if (e.boss) drawBoss(e); else drawEnemy(e); }
  for (const f of G.flyers) { // 날아가는 통나무·금화
    const k = f.t / f.dur, x = f.x0 + (f.x1 - f.x0) * k, y = f.y0 + (f.y1 - f.y0) * k - Math.sin(k * Math.PI) * 30;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, IK);
    if (f.kind === 'log') drawLog(0, 0, 1); else { ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  // 안내 화살표
  if (G.hint && !p.dead) {
    const dx = G.hint.x - p.x, dy = G.hint.y - p.y, d = Math.hypot(dx, dy);
    if (d > 45) {
      const a = Math.atan2(dy, dx), r = 42 + Math.sin(G.t * 8) * 5;
      ctx.save(); ctx.translate(p.x + Math.cos(a) * r, p.y - 12 + Math.sin(a) * r); ctx.rotate(a);
      ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -10); ctx.lineTo(-2, 0); ctx.lineTo(-6, 10); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  for (const c of G.corpses) if (SPR[c.type]) drawSpriteMan(c.type, c.x, c.y, { face: 1, phase: 0, hit: false, flash: false, lunge: 0, rot: c.rot, z: c.z + 6, alpha: Math.min(1, c.life * 2) }); else drawStickman(c.x, c.y, { color: c.color, s: c.s, face: 1, phase: 0, hit: true, flash: false, lunge: 0, type: c.type, rot: c.rot, z: c.z + 6, alpha: Math.min(1, c.life * 2) });
  // 회전 칼
  if (G.weapons.sword && G.deadT <= 0 && !p.dead) {
    const s = wStat('sword');
    for (let k = 0; k < s.n; k++) {
      const a = G.swordAng + k / s.n * Math.PI * 2;
      ctx.save(); ctx.translate(p.x, p.y - 12); ctx.rotate(a);
      ctx.strokeStyle = 'rgba(160,220,255,.35)'; ctx.lineWidth = 10; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, s.rad, -0.5, 0); ctx.stroke();
      ctx.translate(s.rad, 0); ctx.rotate(Math.PI / 2);
      ctx.fillStyle = '#e8f4ff'; ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(5, -14); ctx.lineTo(4, 8); ctx.lineTo(-4, 8); ctx.lineTo(-5, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffb703'; ctx.fillRect(-8, 8, 16, 4); ctx.strokeRect(-8, 8, 16, 4);
      ctx.fillStyle = '#6b4226'; ctx.fillRect(-2.5, 12, 5, 8);
      ctx.restore();
    }
  }
  // 총알
  for (const b of G.bullets) {
    const l = Math.hypot(b.vx, b.vy);
    if (b.kind === 'arrow') {
      const ux = b.vx / l, uy = b.vy / l;
      ctx.strokeStyle = '#6b4226'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(b.x - ux * 16, b.y - uy * 16); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(b.x + ux * 5, b.y + uy * 5); ctx.lineTo(b.x - uy * 3, b.y + ux * 3); ctx.lineTo(b.x + uy * 3, b.y - ux * 3); ctx.fill();
      continue;
    }
    ctx.strokeStyle = b.kind === 'shot' ? 'rgba(255,140,0,.5)' : 'rgba(255,200,0,.55)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx / l * 14, b.y - b.vy / l * 14); ctx.stroke();
    ctx.fillStyle = b.kind === 'shot' ? '#ff7b00' : '#ffd23f'; ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
  }
  for (const b of G.booms) {
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13, 9); ctx.lineTo(0, -4); ctx.lineTo(13, 9); ctx.stroke();
    ctx.strokeStyle = '#c77d3a'; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(-13, 9); ctx.lineTo(0, -4); ctx.lineTo(13, 9); ctx.stroke();
    ctx.restore();
  }
  for (const b of G.ebullets) {
    ctx.fillStyle = '#b5179e'; ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, b.r * 0.35, 0, 7); ctx.fill();
  }
  // 파티클
  for (const q of G.parts) {
    ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size * (0.4 + 0.6 * q.life / q.max), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 레벨업 링
  if (G.lvlFlash > 0) {
    ctx.strokeStyle = `rgba(255,210,63,${G.lvlFlash / 0.6})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y - 12, (0.6 - G.lvlFlash) * 260, 0, 7); ctx.stroke();
  }
  // 글자
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    ctx.save(); ctx.translate(t.x, t.y); ctx.scale(1, IK);
    ctx.font = `900 ${t.size}px system-ui,sans-serif`;
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#222'; ctx.strokeText(t.text, 0, 0);
    ctx.fillStyle = t.color; ctx.fillText(t.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  // 플레이어 체력바
  if (G.deadT <= 0 && !p.dead) {
    ctx.fillStyle = '#222'; ctx.fillRect(p.x - 18, p.y + 19, 36, 6);
    ctx.fillStyle = p.hp / p.maxHp > 0.3 ? '#2ecc71' : '#e63946'; ctx.fillRect(p.x - 17, p.y + 20, 34 * p.hp / p.maxHp, 4);
  }
}

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function hudText(t, x, y, size, color, align) {
  ctx.font = `900 ${size}px system-ui,sans-serif`; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = '#222'; ctx.lineJoin = 'round'; ctx.strokeText(t, x, y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(t, x, y);
}
function drawHUD() {
  const p = G.p, top = 8;
  // 경험치바
  roundRect(8, top, W - 16, 16, 8); ctx.fillStyle = '#222'; ctx.fill();
  roundRect(10, top + 2, (W - 20) * Math.min(1, G.xp / G.need), 12, 6); ctx.fillStyle = '#3fa9f5'; ctx.fill();
  hudText('Lv ' + G.lvl, W / 2, top + 8, 13, '#fff', 'center');
  // 체력
  const hw = Math.min(150, W * 0.36);
  roundRect(8, top + 24, hw, 18, 9); ctx.fillStyle = '#222'; ctx.fill();
  roundRect(10, top + 26, (hw - 4) * Math.max(0, p.hp / p.maxHp), 14, 7); ctx.fillStyle = '#e63946'; ctx.fill();
  hudText(`❤ ${Math.ceil(p.hp)}/${p.maxHp}`, 14, top + 33, 12, '#fff');
  // 시간 / 처치
  hudText(fmtTime(G.t), W / 2, top + 36, 22, '#fff', 'center');
  hudText('💀 ' + G.kills, W - 12, top + 34, 18, '#fff', 'right');
  // 마을 체력 / 금화
  const bb = G.base;
  roundRect(8, top + 48, hw, 18, 9); ctx.fillStyle = '#222'; ctx.fill();
  roundRect(10, top + 50, (hw - 4) * Math.max(0, bb.hp / bb.maxHp), 14, 7); ctx.fillStyle = bb.hitT > 0 ? '#fff' : '#2ecc71'; ctx.fill();
  hudText(`🏠 ${Math.ceil(bb.hp)}`, 14, top + 57, 12, '#fff');
  hudText('🪙 ' + G.gold, W - 12, top + 60, 18, '#ffd23f', 'right');
  if (G.mode === 'base') hudText(`🪵 ${p.logs}/${p.cap}`, W - 12, top + 86, 16, p.logs >= p.cap ? '#ff6b6b' : '#ffe0b3', 'right');
  if (G.hint) {
    ctx.font = '900 15px system-ui,sans-serif'; const tw = ctx.measureText(G.hint.text).width;
    roundRect(W / 2 - tw / 2 - 12, H - 92, tw + 24, 30, 15); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
    hudText(G.hint.text, W / 2, H - 77, 15, '#ffd23f', 'center');
  }
  // 대습격 안내
  if (G.mode === 'base' && G.raidIn > 0) hudText(`⚠ 대습격까지 ${Math.ceil(G.raidIn)}초!`, W / 2, top + 84, 18, Math.floor(G.t * 4) % 2 ? '#ff6b6b' : '#ffd23f', 'center');
  if (G.mode === 'base' && G.raid) {
    const left = G.enemies.filter(e => e.raid).length;
    hudText(G.raid.t < G.raid.dur ? `⚠ 대습격! ${Math.ceil(G.raid.dur - G.raid.t)}초 버텨라` : `⚠ 남은 적 ${left}`, W / 2, top + (G.boss ? 106 : 84), 16, '#ff6b6b', 'center');
    ctx.strokeStyle = `rgba(255,0,0,${0.18 + 0.12 * Math.sin(G.t * 6)})`; ctx.lineWidth = 14; ctx.strokeRect(0, 0, W, H);
  }
  // 다음 보스
  if (!G.boss && G.mode === 'base' && !G.raid && !(G.raidIn > 0)) {
    const left = G.nextBoss;
    if (left < 20) hudText(`보스까지 ${Math.ceil(left)}초!`, W / 2, top + 84, 14, Math.floor(G.t * 4) % 2 ? '#ff6b6b' : '#ffd23f', 'center');
  }
  // 쓰러졌을 때 부활 카운트
  if (p.dead && G.deadT <= 0) hudText(`부활까지 ${Math.ceil(G.respawnT)}`, W / 2, H * 0.62, 26, '#ffd23f', 'center');
  // 스테이지 진행 막대
  if (G.mode === 'stage' && !G.boss) {
    const st = G.st, bw = Math.min(W - 140, 300), bx = (W - bw) / 2, by = top + 76;
    const k = clamp(-p.y / st.L, 0, 1);
    roundRect(bx, by, bw, 14, 7); ctx.fillStyle = '#222'; ctx.fill();
    roundRect(bx + 2, by + 2, (bw - 4) * k, 10, 5); ctx.fillStyle = '#ffd23f'; ctx.fill();
    hudText(`🚩 스테이지 ${st.n + 1} · ${st.th.name}`, W / 2, by + 26, 13, '#fff', 'center');
    hudText('👑', bx + bw + 14, by + 7, 16, '#fff', 'center');
  }
  // 마을이 화면 밖이면 집 방향 표시
  if (G.mode === 'base') {
    const sx = (0 - G.cam.x) * SCALE + W / 2, sy = (0 - G.cam.y) * SCALE * K + H / 2;
    if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) {
      const a = Math.atan2(sy - H / 2, sx - W / 2), m = 30;
      const ax = clamp(W / 2 + Math.cos(a) * W, m, W - m), ay = clamp(H / 2 + Math.sin(a) * H, m + 100, H - m - 50);
      ctx.save(); ctx.translate(ax, ay);
      roundRect(-17, -17, 34, 34, 10); ctx.fillStyle = bb.hitT > 0 ? '#ff6b6b' : 'rgba(255,250,240,.9)'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = '18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText('🏠', 0, 1);
      ctx.restore();
    }
  }
  // 보스 체력
  const b = G.boss;
  if (b) {
    const bw = Math.min(W - 130, 360), bx = (W - bw) / 2, by = top + 78;
    roundRect(bx, by, bw, 18, 9); ctx.fillStyle = '#222'; ctx.fill();
    roundRect(bx + 2, by + 2, (bw - 4) * Math.max(0, b.hp / b.maxHp), 14, 7); ctx.fillStyle = b.color; ctx.fill();
    hudText('👑 ' + b.name, W / 2, by + 9, 12, '#fff', 'center');
    // 화면 밖 보스 화살표
    const sx = (b.x - G.cam.x) * SCALE + W / 2, sy = (b.y - G.cam.y) * SCALE * K + H / 2;
    if (sx < 0 || sx > W || sy < 0 || sy > H) {
      const a = Math.atan2(sy - H / 2, sx - W / 2), m = 34;
      const ax = clamp(W / 2 + Math.cos(a) * W, m, W - m), ay = clamp(H / 2 + Math.sin(a) * H, m + 80, H - m);
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
      ctx.fillStyle = Math.floor(G.t * 6) % 2 ? '#ff3b3b' : '#ffd23f'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  // 무기 아이콘
  let ix = 10;
  ctx.font = '20px sans-serif'; ctx.textBaseline = 'middle';
  for (const id in G.weapons) {
    roundRect(ix, H - 46, 38, 38, 9); ctx.fillStyle = 'rgba(255,250,240,.85)'; ctx.fill(); ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.font = '20px sans-serif'; ctx.fillText(WEAP[id].icon, ix + 19, H - 28);
    hudText('' + G.weapons[id], ix + 33, H - 12, 11, '#ffd23f', 'center');
    ix += 44;
  }
  // 빌드 번호
  ctx.font = '600 10px system-ui,sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillText('Build ' + BUILD, W - 6, H - 4);
  // 배너
  const bn = G.banner;
  if (bn) {
    const k = bn.t < 0.25 ? bn.t / 0.25 : bn.t > bn.dur - 0.4 ? (bn.dur - bn.t) / 0.4 : 1;
    ctx.globalAlpha = Math.max(0, k);
    const sc = bn.t < 0.25 ? 0.5 + k * 0.5 : 1;
    ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(sc, sc);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(-W / 2, -38, W, 76);
    hudText(bn.text, 0, -10, Math.min(36, W / 11), bn.color, 'center');
    if (bn.sub) hudText(bn.sub, 0, 22, 16, '#fff', 'center');
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // 보스 등장 붉은 테두리
  if (bn && bn.text.includes('보스 등장')) {
    ctx.strokeStyle = `rgba(255,0,0,${0.35 + 0.3 * Math.sin(G.t * 18)})`; ctx.lineWidth = 18; ctx.strokeRect(0, 0, W, H);
  }
  // 피격 붉은 화면
  if (p.inv > 0.45) { ctx.fillStyle = `rgba(255,0,0,${(p.inv - 0.45) * 0.6})`; ctx.fillRect(0, 0, W, H); }
  // 조이스틱
  if (joy) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 7); ctx.fill(); ctx.stroke();
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), m = Math.min(l, 50) / (l || 1);
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(joy.ox + dx * m, joy.oy + dy * m, 22, 0, 7); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!G) { // 타이틀 배경
    ctx.fillStyle = '#8fd16a'; ctx.fillRect(0, 0, W, H); return;
  }
  const sx = G.shake ? rand(-G.shake, G.shake) : 0, sy = G.shake ? rand(-G.shake, G.shake) : 0;
  ctx.setTransform(DPR * SCALE, 0, 0, DPR * SCALE, DPR * (W / 2 + sx), DPR * (H / 2 + sy));
  ctx.scale(1, K);
  ctx.translate(-G.cam.x, -G.cam.y);
  if (G.mode === 'stage') drawStageGround(); else drawGround();
  drawWorld();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawHUD();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 테스트·디버그용 훅
window.SH = {
  BUILD,
  get G() { return G; }, get state() { return state; },
  start: startGame, choose: chooseCard,
  addXp(n) { G.xp += n; }, spawnBoss() { spawnBoss(); }, spawnWave() { spawnWave(); },
  give(id, l) { if (WEAP[id]) G.weapons[id] = l; else { G.passives[id] = l; recalcStats(); } },
  kill() { G.p.inv = 0; hurtPlayer(99999); },
  killBase() { hurtBase(99999); },
  gold(n) { G.gold += n; },
  enterStage() { enterStage(); }, returnBase(w) { returnBase(w); }, raid() { startRaid(); },
};
</script>
</body>
